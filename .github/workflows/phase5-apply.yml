name: Apply phase 5 attribution

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/meta-ad-referral-attribution
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect pending application
        id: detect
        run: |
          if [ -f scripts/phase5-apply.py ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply reviewed changes
        if: steps.detect.outputs.apply == 'true'
        run: python scripts/phase5-apply.py
      - name: Setup Node
        if: steps.detect.outputs.apply == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.detect.outputs.apply == 'true'
        run: npm ci --no-audit --no-fund
      - name: Simulate Meta referrals
        if: steps.detect.outputs.apply == 'true'
        run: npm run test:meta-referral
      - name: Validate environment
        if: steps.detect.outputs.apply == 'true'
        run: npm run check-env
      - name: Lint
        if: steps.detect.outputs.apply == 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.detect.outputs.apply == 'true'
        run: npm run typecheck
      - name: Build
        if: steps.detect.outputs.apply == 'true'
        run: npm run build
      - name: Commit validated changes
        if: steps.detect.outputs.apply == 'true'
        run: |
          rm -f scripts/phase5-apply.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Captura origem de anúncios Meta nos leads"
          git push origin HEAD:feature/meta-ad-referral-attribution
