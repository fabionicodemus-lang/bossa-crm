name: Instalar projeto Bossa CRM

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/**"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir e instalar o projeto
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          cat .bootstrap/part-*.b64 | base64 --decode > /tmp/bossa-crm-producao.zip
          rm -rf /tmp/bossa-crm
          mkdir -p /tmp/bossa-crm
          unzip -q /tmp/bossa-crm-producao.zip -d /tmp/bossa-crm
          test -f /tmp/bossa-crm/bossa-crm-real/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bootstrap -exec rm -rf {} +
          cp -a /tmp/bossa-crm/bossa-crm-real/. .
          rm -rf .bootstrap

      - name: Publicar os arquivos na branch main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publica o projeto de produção do Bossa CRM"
          git push
