name: Phase 5 discovery

on:
  pull_request:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mapear exportadores e pipeline
        run: |
          mkdir -p phase5-diagnostic
          find src -type f | sort > phase5-diagnostic/files.txt
          grep -RniE "XLSX|json_to_sheet|writeFile|exportar|download.*xlsx|xlsx.*download" src > phase5-diagnostic/xlsx.txt || true
          grep -RniE "lead-card|PipelineBoard|source|metadata" src/components src/app > phase5-diagnostic/leads-ui.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-diagnostic
          path: phase5-diagnostic
