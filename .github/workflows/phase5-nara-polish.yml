name: Ajustes finais da Fase 5 da Nara

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-5
    paths:
      - .github/workflows/phase5-nara-polish.yml

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Corrigir resolução e leitura de limites monetários
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          module_path = Path('src/lib/nara-unit-queries.ts')
          source = module_path.read_text(encoding='utf-8')

          old_resolver = '\n'.join([
              '  return rows.find((row) => {',
              '    const candidates = [row.name, row.slug, row.code].map(normalizeText);',
              '    return candidates.some((value) => value.includes(alias) || alias.includes(value));',
              '  }) ?? null;',
          ])
          new_resolver = '\n'.join([
              '  return rows.find((row) => {',
              '    const candidates = [row.name, row.slug, row.code]',
              '      .map(normalizeText)',
              '      .filter(Boolean);',
              '    return candidates.some((value) => value.includes(alias) || alias.includes(value));',
              '  }) ?? null;',
          ])
          if source.count(old_resolver) != 1:
              raise SystemExit(f'Resolução de empreendimento encontrada {source.count(old_resolver)} vez(es), esperado 1.')
          source = source.replace(old_resolver, new_resolver, 1)

          old_number = '\n'.join([
              'function numberAfter(message: string, expression: RegExp): number | null {',
              '  const match = normalizeText(message).match(expression)?.[1];',
              '  if (!match) return null;',
              "  const raw = match.replace(/\\./g, '').replace(',', '.');",
              '  const value = Number(raw);',
              '  if (!Number.isFinite(value)) return null;',
              '  const normalized = normalizeText(message);',
              '  if (/milhao|milhoes/.test(normalized)) return value * 1_000_000;',
              '  if (/\\bmil\\b/.test(normalized)) return value * 1_000;',
              '  return value;',
              '}',
          ])
          new_number = '\n'.join([
              'function numberAfter(message: string, expression: RegExp): number | null {',
              '  const match = normalizeText(message).match(expression)?.[1]?.trim();',
              '  if (!match) return null;',
              '  const amount = match.match(/(\\d[\\d.,]*)\\s*(milhao|milhoes|mil)?/) ?? [];',
              "  const raw = String(amount[1] ?? '').replace(/\\./g, '').replace(',', '.');",
              '  const value = Number(raw);',
              '  if (!Number.isFinite(value)) return null;',
              "  const unit = amount[2] ?? '';",
              "  if (unit === 'milhao' || unit === 'milhoes') return value * 1_000_000;",
              "  if (unit === 'mil') return value * 1_000;",
              '  return value;',
              '}',
          ])
          if source.count(old_number) != 1:
              raise SystemExit(f'Leitura monetária encontrada {source.count(old_number)} vez(es), esperado 1.')
          source = source.replace(old_number, new_number, 1)

          old_filters = '\n'.join([
              '  return {',
              '    empreendimento: enterprise,',
              "    tipologia: suites ? `${suites} suítes` : bedrooms ? `${bedrooms} quartos` : normalized.includes('duplex') ? 'duplex' : null,",
              '    andar_min: aboveFloor ? Number(aboveFloor) : exactFloor ? Number(exactFloor) : null,',
              '    andar_max: belowFloor ? Number(belowFloor) : exactFloor ? Number(exactFloor) : null,',
              '    valor_max: numberAfter(message, /(?:valor|preco|ate)\\D{0,12}(\\d[\\d.,]*)/),',
              '    entrada_max: numberAfter(message, /entrada\\D{0,12}(\\d[\\d.,]*)/),',
              '  };',
          ])
          new_filters = '\n'.join([
              "  const amountPattern = '(\\\\d[\\\\d.,]*\\\\s*(?:milhao|milhoes|mil)?)';",
              '  const valueByLabel = numberAfter(',
              '    message,',
              '    new RegExp(`\\\\b(?:valor|preco|orcamento|investimento)(?:\\\\s+maximo)?\\\\D{0,16}${amountPattern}`),',
              '  );',
              '  const genericValue = valueByLabel === null && !/\\bentrada\\b/.test(normalized)',
              '    ? numberAfter(message, new RegExp(`\\\\bate\\\\D{0,12}${amountPattern}`))',
              '    : null;',
              '  return {',
              '    empreendimento: enterprise,',
              "    tipologia: suites ? `${suites} suítes` : bedrooms ? `${bedrooms} quartos` : normalized.includes('duplex') ? 'duplex' : null,",
              '    andar_min: aboveFloor ? Number(aboveFloor) : exactFloor ? Number(exactFloor) : null,',
              '    andar_max: belowFloor ? Number(belowFloor) : exactFloor ? Number(exactFloor) : null,',
              '    valor_max: valueByLabel ?? genericValue,',
              '    entrada_max: numberAfter(message, new RegExp(`\\\\bentrada\\\\D{0,16}${amountPattern}`)),',
              '  };',
          ])
          if source.count(old_filters) != 1:
              raise SystemExit(f'Bloco de filtros encontrado {source.count(old_filters)} vez(es), esperado 1.')
          source = source.replace(old_filters, new_filters, 1)
          module_path.write_text(source, encoding='utf-8')

          test_path = Path('scripts/check-nara-unit-queries.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = "assert.equal(exactContext?.calls[0]?.result?.unidade, '901');"
          addition = """

          const filteredContext = await loadNaraCommercialTurnContext(client, 'org', lead, [
            { role: 'user', content: 'Quero 3 quartos no Flow com valor até R$ 1,02 milhão.' },
          ]);
          assert.equal(filteredContext?.calls[0]?.name, 'buscar_apartamentos');
          assert.deepEqual(filteredContext?.calls[0]?.result.map((row) => row.unidade), ['1101']);

          const twoLimitsContext = await loadNaraCommercialTurnContext(client, 'org', lead, [
            { role: 'user', content: 'No Flow, entrada até 195 mil e valor até R$ 1,2 milhão.' },
          ]);
          assert.equal(twoLimitsContext?.calls[0]?.name, 'buscar_apartamentos');
          assert.deepEqual(twoLimitsContext?.calls[0]?.result.map((row) => row.unidade), ['901', '1001']);
          assert.ok(twoLimitsContext?.calls[0]?.result.every((row) => row.entrada <= 195000));
          """.strip('\n')
          if test.count(marker) != 1:
              raise SystemExit(f'Ponto dos testes monetários encontrado {test.count(marker)} vez(es), esperado 1.')
          test = test.replace(marker, marker + '\n' + addition, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes da Nara
        run: npm run test:nara-prompt && npm run test:nara-fixed-layer && npm run test:nara-price-levels && npm run test:nara-unit-queries

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar ajustes validados
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nara-unit-queries.ts scripts/check-nara-unit-queries.mjs
          git commit -m "Corrige filtros monetários das consultas da Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-5
