name: Ajustar escopo da auditoria da Nara

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-6
    paths:
      - .github/workflows/phase6-nara-audit-scope.yml

permissions:
  contents: write

jobs:
  adjust-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restringir auditoria ao atendimento da Nara
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/lib/whatsapp/webhookProcessor.ts')
          lines = path.read_text(encoding='utf-8').splitlines()
          audit_start = next(i for i, line in enumerate(lines) if line.strip() == 'let offerAuditIds: string[] = [];')
          provider_start = next(i for i in range(audit_start + 1, len(lines)) if 'const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);' in lines[i])
          record_start = next(i for i in range(provider_start + 1, len(lines)) if line_starts(lines[i], 'await recordOutbound({')) if False else None
          audit_body = lines[audit_start + 1:provider_start]
          replacement = [
            '  let offerAuditIds: string[] = [];',
            "  if (lead.kind === 'cliente') {",
            *[f'  {line}' for line in audit_body],
            '  }',
            '',
          ]
          lines[audit_start:provider_start] = replacement

          provider_start = next(i for i, line in enumerate(lines) if line.strip() == 'const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);')
          record_start = next(i for i in range(provider_start + 1, len(lines)) if lines[i].strip() == 'await recordOutbound({')
          lines[provider_start:record_start] = [f'  {line}' for line in lines[provider_start:record_start]]
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test_path = Path('scripts/check-nara-guardrails.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = "assert.ok(webhookSource.indexOf('prepareNaraOfferAudit(args.admin') < webhookSource.indexOf('provider.sendText'));"
          addition = marker + "\nassert.match(webhookSource, /if \\(lead\\.kind === 'cliente'\\)[\\s\\S]*prepareNaraOfferAudit\\(args\\.admin/);"
          if test.count(marker) != 1:
            raise SystemExit('Ponto de validação da auditoria não encontrado.')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testar guardrails e regressões
        run: npm run test:nara-guardrails && npm run test:nara-unit-queries && npm run test:nara-price-levels

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar ajuste validado
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/whatsapp/webhookProcessor.ts scripts/check-nara-guardrails.mjs
          git commit -m "Restringe auditoria de ofertas ao atendimento da Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-6
