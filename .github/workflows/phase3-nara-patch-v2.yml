name: Aplicar Fase 3 da Nara v2

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-3
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar patch da Fase 3
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase3-nara-patch.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-phase3.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply-phase3.py

      - name: Corrigir recorte do teste
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/check-nara-fixed-layer.mjs')
          source = path.read_text(encoding='utf-8')
          old = "const plantaoStart = source.indexOf('Você é o Plantão institucional', naraStart);"
          new = "const plantaoStart = source.indexOf('\\n\\n  return `${shared}', naraStart);"
          if old not in source:
              raise SystemExit('Linha do recorte do Plantão não encontrada.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Validar contrato do prompt
        run: npm run test:nara-prompt

      - name: Validar camada fixa da Nara
        run: npm run test:nara-fixed-layer

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar alteração validada
        shell: bash
        run: |
          rm .github/workflows/phase3-nara-patch.yml
          rm .github/workflows/phase3-nara-patch-v2.yml
          rm -f docs/.phase3-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limpa a camada fixa da Nara para o prompt v3"
          git push origin HEAD:feature/nara-prompt-v3-phase-3
