name: Executar Fase 5 da Nara no PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extrair e aplicar implementação preparada
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase5-nara-unit-queries.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          block = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              "assert.match(aiSource, /base de conhecimento, e o retorno das consultas comerciais/);",
              "assert.match(aiSource, /nas mensagens do contato, na base de conhecimento, ou no retorno das consultas comerciais/);",
          )
          script = script.replace(
              "precos?|valores?|quanto custa|faixa|a partir de|tabela|disponiv|unidade",
              "precos?|valores?|quanto custa|faixa|a partir de|tabela|disponibilidade|disponive(?:l|is)|unidade",
          )
          script = script.replace(
              "disponiv|unidade|apto|apartamento|entrada",
              "disponibilidade|disponive(?:l|is)|unidade|apto|apartamento|entrada",
          )
          Path('/tmp/apply-phase5.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply-phase5.py

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testar contrato do prompt
        run: npm run test:nara-prompt

      - name: Testar camada fixa
        run: npm run test:nara-fixed-layer

      - name: Testar níveis de preço
        run: npm run test:nara-price-levels

      - name: Testar consultas de unidades
        run: npm run test:nara-unit-queries

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar implementação validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          rm -f .github/workflows/phase5-nara-unit-queries.yml
          rm -f .github/workflows/phase5-nara-pr-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nara-unit-queries.ts src/lib/ai.ts src/lib/whatsapp/webhookProcessor.ts src/app/api/ai-training/route.ts scripts/check-nara-unit-queries.mjs package.json .github/workflows/validate.yml .github/workflows/phase5-nara-unit-queries.yml .github/workflows/phase5-nara-pr-runner.yml
          git commit -m "Integra consultas de unidades e preços à Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-5
