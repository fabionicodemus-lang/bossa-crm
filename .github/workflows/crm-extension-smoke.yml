name: CRM offline extension smoke (no source data)
on:
  push:
    branches:
      - ops/crm-free-recovery-20261029
    paths:
      - .github/workflows/crm-extension-smoke.yml
permissions: {}
jobs:
  synthetic-extension-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Rehearse all exact managed extension owners without source credentials
        shell: bash
        run: |
          set -euo pipefail
          image='supabase/postgres:17.6.1.147@sha256:ac581882596ed0e46937ea6dd53a627d09f53e005d7264c2082a7ff7b62eaaca'
          docker pull "$image" >/dev/null
          name="bossa-smoke-$GITHUB_RUN_ID"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --network none --entrypoint sleep "$image" infinity >/dev/null
          test "$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$name")" = none
          docker exec "$name" sh -c 'mkdir -p /recovery && chown postgres:postgres /recovery'
          docker exec --user postgres "$name" initdb -D /recovery/data -U supabase_admin -A trust --no-instructions >/dev/null
          # Ephemeral fictitious key to keep pg_net requests disabled while loading vault.
          docker exec --user postgres "$name" sh -c "printf '%064d\n' 0 >/recovery/vault.key; printf '#!/bin/sh\nexec cat /recovery/vault.key\n' >/recovery/getkey; chmod 700 /recovery/getkey"
          docker exec --detach --user postgres "$name" sh -c "exec postgres -D /recovery/data -c listen_addresses='' -c unix_socket_directories=/tmp -c shared_preload_libraries=pg_cron,pg_stat_statements,supabase_vault,pg_net -c cron.database_name=postgres -c cron.launch_active_jobs=off -c vault.getkey_script=/recovery/getkey -c log_min_error_statement=panic >/recovery/server.log 2>&1"
          ready=false
          for i in {1..40}; do
            if docker exec "$name" pg_isready -h /tmp -U supabase_admin -d postgres >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE postgres WITH NOSUPERUSER LOGIN;
          CREATE SCHEMA extensions AUTHORIZATION supabase_admin;
          CREATE SCHEMA vault AUTHORIZATION supabase_admin;
          DROP EXTENSION plpgsql;
          SQL
          printf 'STAGE=EXT_PLPGSQL\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          SET SESSION AUTHORIZATION supabase_admin;
          CREATE EXTENSION plpgsql WITH SCHEMA pg_catalog VERSION '1.0';
          SQL
          printf 'STAGE=EXT_BTREE_GIST\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION btree_gist WITH SCHEMA public VERSION '1.7';
          SQL
          printf 'STAGE=EXT_PG_CRON\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION pg_cron WITH SCHEMA pg_catalog VERSION '1.6.4';
          SQL
          printf 'STAGE=EXT_PG_NET\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION pg_net WITH SCHEMA public VERSION '0.20.4';
          SQL
          printf 'STAGE=EXT_PG_STAT_STATEMENTS\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          ALTER ROLE postgres WITH SUPERUSER;
          SET SESSION AUTHORIZATION postgres;
          CREATE EXTENSION pg_stat_statements WITH SCHEMA extensions VERSION '1.11';
          RESET SESSION AUTHORIZATION;
          ALTER ROLE postgres WITH NOSUPERUSER;
          COMMIT;
          SQL
          printf 'STAGE=EXT_PGCRYPTO\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          SET SESSION AUTHORIZATION postgres;
          CREATE EXTENSION pgcrypto WITH SCHEMA extensions VERSION '1.3';
          SQL
          printf 'STAGE=EXT_SUPABASE_VAULT\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION supabase_vault WITH SCHEMA vault VERSION '0.3.1';
          SQL
          printf 'STAGE=EXT_UUID_OSSP\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          SET SESSION AUTHORIZATION postgres;
          CREATE EXTENSION "uuid-ossp" WITH SCHEMA extensions VERSION '1.1';
          SQL
          printf 'STAGE=DISABLE_PG_NET_BEFORE_RESTORING_SOURCE_DATA\n'
          docker exec --user postgres "$name" pg_ctl -D /recovery/data -m fast stop >/dev/null
          docker exec --detach --user postgres "$name" sh -c "exec postgres -D /recovery/data -c listen_addresses='' -c unix_socket_directories=/tmp -c shared_preload_libraries=pg_cron,pg_stat_statements,supabase_vault -c cron.database_name=postgres -c cron.launch_active_jobs=off -c vault.getkey_script=/recovery/getkey -c log_min_error_statement=panic >/recovery/server.log 2>&1"
          ready=false
          for i in {1..40}; do
            if docker exec "$name" pg_isready -h /tmp -U supabase_admin -d postgres >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'pg_net_disabled=' || (position('pg_net' in current_setting('shared_preload_libraries'))=0)::text;
          SELECT 'cron_jobs_disabled=' || current_setting('cron.launch_active_jobs');
          SELECT 'pg_net_queue_rows=' || count(*)::text FROM net.http_request_queue;
          SQL
          printf 'STAGE=CHECK_ROLE_OWNERS\n'
          docker exec -i "$name" psql -h /tmp -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1 <<'SQL'
          SELECT extname, pg_get_userbyid(extowner) FROM pg_extension ORDER BY extname;
          SELECT 'postgres_super=' || rolsuper::text FROM pg_roles WHERE rolname='postgres';
          SQL
          printf 'STAGE=SMOKE_PASS\n'
