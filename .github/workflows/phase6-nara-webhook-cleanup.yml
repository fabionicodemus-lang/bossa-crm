name: Limpar webhook da Fase 6

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-6
    paths:
      - .github/workflows/phase6-nara-webhook-cleanup.yml

permissions:
  contents: write

jobs:
  clean-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restaurar função de arquivos e formatar envio
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from subprocess import check_output
          from textwrap import dedent

          path = Path('src/lib/whatsapp/webhookProcessor.ts')
          current = path.read_text(encoding='utf-8')
          base = check_output(['git', 'show', 'origin/main:src/lib/whatsapp/webhookProcessor.ts'], text=True)

          files_start_marker = 'async function sendSelectedFiles(args: {'
          files_end_marker = 'async function handleAiFailure(args: {'
          current_start = current.index(files_start_marker)
          current_end = current.index(files_end_marker, current_start)
          base_start = base.index(files_start_marker)
          base_end = base.index(files_end_marker, base_start)
          current = current[:current_start] + base[base_start:base_end] + current[current_end:]

          process_start = current.index('async function processConversation(args: {')
          audit_start = current.index('  let offerAuditIds: string[] = [];', process_start)
          record_start = current.index('  await recordOutbound({', audit_start)
          clean_send = dedent('''
            let offerAuditIds: string[] = [];
            if (lead.kind === 'cliente') {
              try {
                offerAuditIds = await prepareNaraOfferAudit(args.admin, {
                  organizationId: args.channel.organization_id,
                  leadId: lead.id,
                  conversationId: args.conversation.id,
                  reply,
                  commercial: context.commercial,
                });
              } catch (error) {
                console.error('[nara offer audit prepare]', error);
                await handleAiFailure({
                  admin: args.admin,
                  channel: args.channel,
                  conversation: args.conversation,
                  lead,
                  error,
                });
                return;
              }
            }

            const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);
            let result: Awaited<ReturnType<typeof provider.sendText>>;
            try {
              result = await provider.sendText({
                phoneNumberId,
                accessToken,
                to: destination,
                body: reply,
              });
            } catch (error) {
              try {
                await markNaraOfferAuditFailed(args.admin, offerAuditIds, error);
              } catch (auditError) {
                console.error('[nara offer audit failed status]', auditError);
              }
              await handleAiFailure({
                admin: args.admin,
                channel: args.channel,
                conversation: args.conversation,
                lead,
                error,
              });
              return;
            }

            try {
              await markNaraOfferAuditSent(args.admin, offerAuditIds, result.messageId);
            } catch (error) {
              console.error('[nara offer audit sent status]', error);
            }

          ''')
          clean_send = '\n'.join(f'  {line}' if line else '' for line in clean_send.splitlines()).lstrip('\n')
          current = current[:audit_start] + clean_send + current[record_start:]
          path.write_text(current, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testar guardrails
        run: npm run test:nara-guardrails

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar limpeza validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/whatsapp/webhookProcessor.ts
          git commit -m "Limpa integração da auditoria no webhook"
          git push origin HEAD:feature/nara-prompt-v3-phase-6
