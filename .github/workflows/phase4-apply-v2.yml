name: Apply phase 4 repository hygiene v2

on:
  push:
    branches:
      - chore/repository-ci-phase-4
    paths:
      - .github/workflows/phase4-apply-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-ci-phase-4
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply source changes
        id: apply
        shell: bash
        run: |
          mkdir -p docs
          if python scripts/phase4-apply.py > docs/phase4-apply.log 2>&1; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            cp docs/phase4-apply.log /tmp/phase4-apply.log
            git reset --hard HEAD
            mkdir -p docs
            cp /tmp/phase4-apply.log docs/phase4-apply.log
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "apply_status=$status" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare repository and reports
        if: steps.apply.outputs.success == 'true'
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap.yml
          rm -f docs/phase4-lint-initial.txt
          find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort > docs/phase4-migrations-list.txt
          {
            echo '# Mapa bruto de referências a Coexistência e Embedded Signup'
            echo
            echo 'Gerado automaticamente para revisão na Fase 4. Nenhum item abaixo foi removido nesta fase.'
            echo
            echo '```text'
            grep -RniE 'coexist|embedded.signup|FEATURE_EMBEDDED_SIGNUP|NEXT_PUBLIC_META_CONFIG_ID|NEXT_PUBLIC_META_APP_ID' README.md .env.example src supabase 2>/dev/null || true
            echo '```'
          } > docs/phase4-coexistence-map-raw.md

      - name: Setup Node
        if: steps.apply.outputs.success == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run acceptance pipeline
        if: steps.apply.outputs.success == 'true'
        shell: bash
        run: |
          set +e
          : > docs/phase4-validation.txt
          run_check() {
            name="$1"
            shift
            echo "## $name" >> docs/phase4-validation.txt
            "$@" >> docs/phase4-validation.txt 2>&1
            code=$?
            echo "exit=$code" >> docs/phase4-validation.txt
            echo >> docs/phase4-validation.txt
            return 0
          }
          run_check "npm ci" npm ci --no-audit --no-fund
          run_check "npm run check-env" npm run check-env
          run_check "npm run lint" npm run lint
          run_check "npm run typecheck" npm run typecheck
          run_check "npm run build" npm run build

      - name: Remove temporary helpers
        shell: bash
        run: |
          rm -f .github/workflows/phase4-apply.yml
          rm -f .github/workflows/phase4-apply-v2.yml
          rm -f scripts/phase4-apply.py

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplica higiene de repositório e registra validação da fase 4"
          git push origin HEAD:chore/repository-ci-phase-4
