name: Phase 4 lockfile diagnostic

on:
  push:
    branches:
      - chore/repository-ci-phase-4
    paths:
      - .github/workflows/phase4-lockfile-diagnostic.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-ci-phase-4
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lock
        run: npm install --no-audit --no-fund

      - name: Capture initial lint report
        shell: bash
        run: |
          mkdir -p docs
          npm run lint > docs/phase4-lint-initial.txt 2>&1 || true

      - name: Remove temporary workflow
        run: rm .github/workflows/phase4-lockfile-diagnostic.yml

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/phase4-lint-initial.txt .github/workflows/phase4-lockfile-diagnostic.yml
          git commit -m "Gera lockfile e registra diagnóstico inicial do lint"
          git push origin HEAD:chore/repository-ci-phase-4
