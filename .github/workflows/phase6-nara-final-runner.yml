name: Finalizar Fase 6 da Nara

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-6
    paths:
      - .github/workflows/phase6-nara-final-runner.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Gerar implementação final
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source_workflow = Path('.github/workflows/phase6-nara-guardrails.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = source_workflow.index(marker) + len(marker)
          end = source_workflow.index("\n          PY", start)
          block = source_workflow[start:end]
          generator = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'

          send_start = generator.index("old_send = dedent(r'''")
          send_end_marker = "webhook = webhook.replace(old_send, new_send, 1)\n"
          send_end = generator.index(send_end_marker, send_start) + len(send_end_marker)
          send_replacement = r"""send_marker = "  const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);\n  const result = await provider.sendText({"
          record_marker = "  await recordOutbound({"
          send_position = webhook.index(send_marker)
          record_position = webhook.index(record_marker, send_position)
          new_send = dedent(r'''
            let offerAuditIds: string[] = [];
            try {
              offerAuditIds = await prepareNaraOfferAudit(args.admin, {
                organizationId: args.channel.organization_id,
                leadId: lead.id,
                conversationId: args.conversation.id,
                reply,
                commercial: context.commercial,
              });
            } catch (error) {
              console.error('[nara offer audit prepare]', error);
              await handleAiFailure({
                admin: args.admin,
                channel: args.channel,
                conversation: args.conversation,
                lead,
                error,
              });
              return;
            }

            const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);
            let result: Awaited<ReturnType<typeof provider.sendText>>;
            try {
              result = await provider.sendText({
                phoneNumberId,
                accessToken,
                to: destination,
                body: reply,
              });
            } catch (error) {
              try {
                await markNaraOfferAuditFailed(args.admin, offerAuditIds, error);
              } catch (auditError) {
                console.error('[nara offer audit failed status]', auditError);
              }
              await handleAiFailure({
                admin: args.admin,
                channel: args.channel,
                conversation: args.conversation,
                lead,
                error,
              });
              return;
            }

            try {
              await markNaraOfferAuditSent(args.admin, offerAuditIds, result.messageId);
            } catch (error) {
              console.error('[nara offer audit sent status]', error);
            }

          ''')
          webhook = webhook[:send_position] + new_send + webhook[record_position:]
          """
          generator = generator[:send_start] + send_replacement + generator[send_end:]

          generator = generator.replace(
              "assert.ok(webhookSource.indexOf('prepareNaraOfferAudit') < webhookSource.indexOf('provider.sendText'));",
              "assert.ok(webhookSource.indexOf('prepareNaraOfferAudit(args.admin') < webhookSource.indexOf('provider.sendText'));",
          )
          generator = generator.replace(
              "assert.ok(webhookSource.indexOf('markNaraOfferAuditSent') > webhookSource.indexOf('provider.sendText'));",
              "assert.ok(webhookSource.lastIndexOf('markNaraOfferAuditSent') > webhookSource.indexOf('provider.sendText'));",
          )

          ai_import = '\n'.join([
              "import {",
              "  hasForbiddenScarcityClaim,",
              "  naraReplyGuardrailViolations,",
              "  naraReplyWordCount,",
              "} from '../src/lib/ai.ts';",
          ])
          pure_helpers = '\n'.join([
              "function normalizeGuardrailText(value) {",
              "  return value.normalize('NFD').replace(/\\p{Diacritic}/gu, '').toLocaleLowerCase('pt-BR').replace(/\\s+/g, ' ').trim();",
              "}",
              "function naraReplyWordCount(value) {",
              "  return value.match(/[\\p{L}\\p{N}]+(?:['’.-][\\p{L}\\p{N}]+)*/gu)?.length ?? 0;",
              "}",
              "function hasForbiddenScarcityClaim(value) {",
              "  const normalized = normalizeGuardrailText(value);",
              "  return /\\b(acabou de ser (?:vendid[oa]|reservad[oa]|bloquead[oa])|acabou de (?:vender|reservar|bloquear)|foi (?:vendid[oa]|reservad[oa]) (?:agora|hoje|ha pouco))\\b/.test(normalized);",
              "}",
              "function naraReplyGuardrailViolations(value) {",
              "  const violations = [];",
              "  if (!value.trim()) violations.push('resposta_vazia');",
              "  if (naraReplyWordCount(value) > 45) violations.push('mais_de_45_palavras');",
              "  if (hasForbiddenScarcityClaim(value)) violations.push('escassez_fabricada');",
              "  return violations;",
              "}",
          ])
          generator = generator.replace(ai_import, pure_helpers)
          Path('/tmp/apply-phase6.py').write_text(generator, encoding='utf-8')
          PY
          python /tmp/apply-phase6.py

          python <<'PY'
          from pathlib import Path

          query_path = Path('src/lib/nara-unit-queries.ts')
          query_source = query_path.read_text(encoding='utf-8')
          query_source = query_source.replace('precos?|valores?|quanto custa', 'precos?|valor(?:es)?|quanto custa')
          query_path.write_text(query_source, encoding='utf-8')

          offer_path = Path('src/lib/nara-offer-log.ts')
          lines = offer_path.read_text(encoding='utf-8').splitlines()
          parsed_index = next((i for i, line in enumerate(lines) if "const parsed = numeric.includes(',')" in line), None)
          if parsed_index is None:
              raise SystemExit('Início do parser monetário não encontrado.')
          parsed_end = next((i for i in range(parsed_index, min(parsed_index + 10, len(lines))) if ': Number(numeric);' in lines[i]), None)
          if parsed_end is None:
              raise SystemExit('Fim do parser monetário não encontrado.')
          original_block = lines[parsed_index:parsed_end + 1]
          clean_block = [line.replace('numeric', 'cleanNumeric') for line in original_block]
          lines[parsed_index:parsed_end + 1] = ["  const cleanNumeric = numeric.replace(/\\.+$/, '');", *clean_block]
          offer_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes da Nara
        run: npm run test:nara-prompt && npm run test:nara-fixed-layer && npm run test:nara-price-levels && npm run test:nara-unit-queries && npm run test:nara-guardrails

      - name: Validar ambiente
        run: npm run check-env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar implementação validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          rm -f .github/workflows/phase6-nara-guardrails.yml
          rm -f .github/workflows/phase6-nara-fix-runner.yml
          rm -f .github/workflows/phase6-nara-final-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate.yml package.json scripts/check-nara-guardrails.mjs src/lib/ai.ts src/lib/ai-v120.ts src/lib/nara-unit-queries.ts src/lib/nara-offer-log.ts src/lib/whatsapp/webhookProcessor.ts supabase/migrations/017_nara_offer_logs.sql .github/workflows/phase6-nara-guardrails.yml .github/workflows/phase6-nara-fix-runner.yml .github/workflows/phase6-nara-final-runner.yml
          git commit -m "Adiciona guardrails e auditoria de ofertas da Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-6
