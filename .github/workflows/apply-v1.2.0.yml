name: Apply Bossa CRM v1.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/apply-v1.2.0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply version and Nara conversation fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          ai_path = Path('src/lib/ai.ts')
          ai = ai_path.read_text()

          old_types = """type InputTextBlock = {
            type: 'input_text';
            text: string;
            prompt_cache_breakpoint?: { mode: 'explicit' };
          };
          type InputMessage = {
            type: 'message';
            role: 'system' | 'developer' | 'user' | 'assistant';
            content: InputTextBlock[];
          };"""
          new_types = """type InputTextBlock = {
            type: 'input_text';
            text: string;
            prompt_cache_breakpoint?: { mode: 'explicit' };
          };
          type OutputTextBlock = {
            type: 'output_text';
            text: string;
          };
          type InputMessage = {
            type: 'message';
            role: 'system' | 'developer' | 'user' | 'assistant';
            content: InputTextBlock[] | OutputTextBlock[];
          };"""
          if old_types in ai:
              ai = ai.replace(old_types, new_types, 1)

          old_input = """function inputMessage(role: InputMessage['role'], text: string, cacheBreakpoint = false): InputMessage {
            const block: InputTextBlock = { type: 'input_text', text };
            if (cacheBreakpoint) block.prompt_cache_breakpoint = { mode: 'explicit' };
            return { type: 'message', role, content: [block] };
          }"""
          new_input = """function inputMessage(role: InputMessage['role'], text: string, cacheBreakpoint = false): InputMessage {
            if (role === 'assistant') {
              return { type: 'message', role, content: [{ type: 'output_text', text }] };
            }
            const block: InputTextBlock = { type: 'input_text', text };
            if (cacheBreakpoint) block.prompt_cache_breakpoint = { mode: 'explicit' };
            return { type: 'message', role, content: [block] };
          }"""
          if old_input in ai:
              ai = ai.replace(old_input, new_input, 1)

          route_pattern = re.compile(r"function routeOutsideBuyerProfile\(text: string\): boolean \{.*?\n\}\n\nfunction asksCommercialValue", re.S)
          route_replacement = r"""type NaraTriageResolution = {
            reply: string;
            handoff: boolean;
            summary: string;
            nextAction: string;
          };

          function routeOutsideBuyerProfile(text: string): boolean {
            const value = normalizeText(text);
            if (/\b(nao sou corretor|nao sou cliente)\b/.test(value)) return false;
            return /\b(corretor|corretora|imobiliaria|creci|ja comprei|sou cliente|segunda via|boleto|contrato|pos-venda|assistencia|entrega|chaves|fornecedor|prestador|curriculo|vaga|trabalhar com voces|cobranca|imprensa)\b/.test(value);
          }

          function outsideBuyerReply(history: ChatMessage[]): string {
            const value = normalizeText(lastUserText(history));
            if (/\b(corretor|corretora|imobiliaria|creci)\b/.test(value)) {
              return 'Claro. Vou direcionar você para o Plantão da Bossa, que atende corretores parceiros.';
            }
            if (/\b(ja comprei|sou cliente|segunda via|boleto|contrato|pos-venda|assistencia|entrega|chaves)\b/.test(value)) {
              return 'Claro. Vou direcionar você para a equipe responsável pelos clientes. Pode me dizer em uma frase qual é o assunto?';
            }
            return 'Claro. Vou direcionar você para a equipe responsável. Pode me dizer em uma frase qual atendimento precisa?';
          }

          function contextualNaraTriageResolution(history: ChatMessage[]): NaraTriageResolution | null {
            const value = normalizeText(lastUserText(history));
            if (!value) return null;

            const asksAboutBossa = /\b(o que|oq|quem e|quem eh|como funciona|me fale sobre).*\bbossa\b/.test(value)
              || /\bsobre a bossa\b/.test(value);
            if (asksAboutBossa) {
              return {
                reply: 'A Bossa atua com empreendimentos imobiliários e hoje apresenta o Flow Aptos e o Alma Seahouses. Posso te explicar os projetos, os valores ou direcionar para outro setor — o que você quer entender primeiro?',
                handoff: false,
                summary: 'Contato pediu uma explicação geral sobre a Bossa.',
                nextAction: 'Responder à dúvida institucional e identificar qual assunto deseja conhecer.',
              };
            }

            const asksOtherService = /\b(atendimento bossa|outro atendimento|outro assunto|preciso de atendimento|preciso falar com a bossa|quero falar com a bossa|falar com atendente|falar com uma pessoa|atendimento humano)\b/.test(value);
            if (asksOtherService) {
              return {
                reply: 'Claro. Qual assunto você precisa tratar com a Bossa: compra de imóvel, cliente atual, financeiro, obra ou outro?',
                handoff: true,
                summary: 'Contato solicitou outro tipo de atendimento da Bossa.',
                nextAction: 'Identificar o assunto e encaminhar para a equipe humana responsável.',
              };
            }

            const isUndecided = /\b(ainda nao sei|nao sei ainda|estou pensando|ainda estou pensando|nao decidi|so estou olhando|so quero entender|estou avaliando|tenho duvida)\b/.test(value);
            if (isUndecided) {
              return {
                reply: 'Sem problema — você pode conhecer primeiro, sem decidir agora. Posso te explicar rapidamente os empreendimentos, a localização ou como funcionam os valores; por onde prefere começar?',
                handoff: false,
                summary: 'Contato ainda está avaliando e quer entender melhor antes de decidir.',
                nextAction: 'Apresentar informações introdutórias sem pressionar e descobrir o tema de maior interesse.',
              };
            }

            return null;
          }

          function applyNaraTriageResolution(turn: AiTurn, resolution: NaraTriageResolution): AiTurn {
            turn.reply = resolution.reply;
            turn.classification = 'frio';
            turn.score = Math.min(turn.score, 20);
            turn.stage = 'ia';
            turn.summary = resolution.summary;
            turn.next_action = resolution.nextAction;
            turn.handoff = resolution.handoff;
            turn.attachment_ids = [];
            turn.extracted.budget = '';
            turn.extracted.typology = '';
            turn.extracted.deadline = '';
            turn.extracted.decision_maker = '';
            return turn;
          }

          function unclearTriageFollowUp(lastUser: string): string {
            if (asksCommercialValue(lastUser)) {
              return 'Posso te ajudar com valores, sim. Antes de passar uma condição que talvez não sirva para você, prefere conhecer rapidamente o Flow Aptos ou o Alma Seahouses?';
            }
            return 'Entendi. Para eu responder sem ficar repetindo: você quer saber sobre os empreendimentos, valores, atendimento a clientes, obra ou outro assunto?';
          }

          function asksCommercialValue"""
          ai, count = route_pattern.subn(route_replacement, ai, count=1)
          if count != 1:
              raise SystemExit('Não foi possível localizar a área de roteamento da Nara.')

          enforce_pattern = re.compile(r"function enforceNaraTriage\(turn: AiTurn, lead: Lead, history: ChatMessage\[], context: AiTrainingContext\): AiTurn \{.*?\n\}\n\nfunction supportsExplicitCaching", re.S)
          enforce_replacement = r"""function enforceNaraTriage(turn: AiTurn, lead: Lead, history: ChatMessage[], context: AiTrainingContext): AiTurn {
            normalizeClientDecision(turn);
            const lastUser = lastUserText(history);
            const contextualResolution = contextualNaraTriageResolution(history);
            if (contextualResolution) {
              const resolved = applyNaraTriageResolution(turn, contextualResolution);
              resolved.reply = ensureFirstTurnIntroduction(resolved.reply, history, context);
              return resolved;
            }

            const routed = routeOutsideBuyerProfile(lastUser);
            const buyerConfirmed = hasExplicitBuyerIntent(lead, history, context);
            const askedBefore = hasTriageQuestionBeenAsked(history, context);

            if (routed) {
              turn.stage = 'ia';
              turn.handoff = true;
              turn.attachment_ids = [];
              turn.classification = 'frio';
              turn.score = Math.min(turn.score, 20);
              turn.summary = 'Contato pertence a outro perfil ou solicitou um atendimento não comercial.';
              turn.next_action = 'Direcionar para o canal humano responsável e identificar o assunto.';
              turn.reply = ensureFirstTurnIntroduction(outsideBuyerReply(history), history, context);
              return turn;
            }

            if (!buyerConfirmed) {
              const learnedCorrection = exactManagerCorrection(history, context);
              const usableCorrection = learnedCorrection
                && !repeatedReply(learnedCorrection, history)
                && !hasUngroundedMoney(learnedCorrection, history, context);

              if (usableCorrection) {
                turn.reply = learnedCorrection;
              } else if (!askedBefore) {
                turn.reply = configuredTriageQuestion(context);
              } else {
                const candidate = turn.reply.trim();
                const usefulCandidate = Boolean(candidate)
                  && !looksLikeTriageQuestion(candidate, context)
                  && !repeatedReply(candidate, history)
                  && !hasUngroundedMoney(candidate, history, context);
                turn.reply = usefulCandidate ? candidate : unclearTriageFollowUp(lastUser);
              }

              turn.reply = ensureFirstTurnIntroduction(turn.reply, history, context);
              turn.classification = 'frio';
              turn.score = Math.min(turn.score, 20);
              turn.stage = 'ia';
              turn.summary = asksCommercialValue(lastUser)
                ? 'Contato pediu informação comercial, mas a intenção de compra ainda não foi confirmada.'
                : 'Triagem em andamento; a resposta considera a última mensagem sem repetir perguntas anteriores.';
              turn.next_action = askedBefore
                ? 'Responder ao assunto atual e descobrir naturalmente se existe interesse de compra.'
                : 'Aguardar o contato confirmar se busca comprar um imóvel ou se precisa de outro atendimento.';
              turn.handoff = false;
              turn.attachment_ids = [];
              turn.extracted.budget = '';
              turn.extracted.typology = '';
              turn.extracted.deadline = '';
              turn.extracted.decision_maker = '';
              return turn;
            }

            const learnedCorrection = exactManagerCorrection(history, context);
            if (learnedCorrection) turn.reply = learnedCorrection;

            if (managerRejectedSameReply(turn, history, context) || repeatedReply(turn.reply, history)) {
              turn.reply = nextQualificationQuestion(history);
              turn.stage = 'ia';
              turn.attachment_ids = [];
              turn.summary = 'Possível comprador identificado; a conversa avançou para a próxima pergunta ainda não respondida.';
              turn.next_action = 'Continuar a qualificação sem repetir perguntas.';
            }

            if (hasUngroundedMoney(turn.reply, history, context)) {
              turn.reply = nextQualificationQuestion(history);
              turn.stage = 'ia';
              turn.handoff = false;
              turn.attachment_ids = [];
              turn.summary = 'Possível comprador identificado, mas não havia preço atual e comprovado na base para informar.';
              turn.next_action = 'Continuar a qualificação e confirmar a informação comercial vigente antes de informar valores.';
            }

            turn.reply = ensureFirstTurnIntroduction(turn.reply, history, context);
            return turn;
          }

          function supportsExplicitCaching"""
          ai, count = enforce_pattern.subn(enforce_replacement, ai, count=1)
          if count != 1:
              raise SystemExit('Não foi possível localizar enforceNaraTriage.')

          ai_path.write_text(ai)

          sidebar_path = Path('src/components/Sidebar.tsx')
          sidebar = sidebar_path.read_text()
          old_sidebar = """      <div className=\"sidebar-user\">
                <div className=\"user-chip\">"""
          new_sidebar = """      <div className=\"sidebar-user\">
                <div style={{ fontSize: '10px', fontWeight: 700, letterSpacing: '0.08em', color: '#8a8178', marginBottom: '6px', textTransform: 'uppercase' }}>Versão 1.2.0</div>
                <div className=\"user-chip\">"""
          if old_sidebar not in sidebar:
              raise SystemExit('Não foi possível localizar o bloco do usuário na Sidebar.')
          sidebar_path.write_text(sidebar.replace(old_sidebar, new_sidebar, 1))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['version'] = '1.2.0'
          package.get('scripts', {}).pop('prebuild', None)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          old_patch = Path('scripts/patch-nara-loop.mjs')
          if old_patch.exists():
              old_patch.unlink()
          PY

          rm -f .github/triggers/apply-v1.2.0
          rm -f .github/workflows/apply-v1.2.0.yml

      - name: Commit version 1.2.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bossa CRM v1.2.0: corrige contexto e repetição da Nara"
          git push
