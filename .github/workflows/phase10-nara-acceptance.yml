name: Implementar Fase 10 da Nara

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-10
    paths:
      - .github/workflows/phase10-nara-acceptance.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-10
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Corrigir ponto de aplicação
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-nara-phase10.py')
          source = path.read_text(encoding='utf-8')
          old = '''replace_once(hybrid_server,
          "        routed_to_kind: routedToBroker ? 'corretor' : null,\\n        stage_before:",
          "        routed_to_kind: routedToBroker ? 'corretor' : null,\\n        sale_assisted: routedToAssistedSale,\\n        stage_before:")'''
          new = '''replace_once(hybrid_server,
          "        kind_after: routedToBroker ? 'corretor' : args.lead.kind,\\n        stage_before:",
          "        kind_after: routedToBroker ? 'corretor' : args.lead.kind,\\n        sale_assisted: routedToAssistedSale,\\n        stage_before:")'''
          if old not in source:
              raise SystemExit('Bloco de correção da atividade não encontrado no aplicador.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Aplicar implementação
        run: python scripts/apply-nara-phase10.py

      - name: Corrigir código gerado e resolução dos testes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          ai_path = Path('src/lib/ai.ts')
          ai_source = ai_path.read_text(encoding='utf-8')
          broken = "const fullHistory = userMessages.map(routingText).join('\n');"
          fixed = "const fullHistory = userMessages.map(routingText).join('\\n');"
          if broken not in ai_source:
              raise SystemExit('Quebra de linha gerada em ai.ts não encontrada.')
          ai_path.write_text(ai_source.replace(broken, fixed, 1), encoding='utf-8')

          v120_path = Path('src/lib/ai-v120.ts')
          v120_source = v120_path.read_text(encoding='utf-8')
          old_openings = "const priorOpenings = priorMessages.slice(-12).map(naraReplyOpeningKey).filter(Boolean);"
          new_openings = "const priorOpenings = priorMessages.map(naraReplyOpeningKey).filter(Boolean);"
          if old_openings not in v120_source:
              raise SystemExit('Janela de aberturas repetidas não encontrada em ai-v120.ts.')
          v120_path.write_text(v120_source.replace(old_openings, new_openings, 1), encoding='utf-8')

          package_path = Path('package.json')
          package_source = package_path.read_text(encoding='utf-8')
          replacements = {
            '"test:nara-unit-queries": "node --experimental-strip-types scripts/check-nara-unit-queries.mjs"':
              '"test:nara-unit-queries": "node --experimental-strip-types --experimental-loader ./scripts/ts-extension-loader.mjs scripts/check-nara-unit-queries.mjs"',
            '"test:nara-guardrails": "node --experimental-strip-types scripts/check-nara-guardrails.mjs"':
              '"test:nara-guardrails": "node --experimental-strip-types --experimental-loader ./scripts/ts-extension-loader.mjs scripts/check-nara-guardrails.mjs"',
          }
          for old, new in replacements.items():
              if old not in package_source:
                  raise SystemExit(f'Script de teste não encontrado: {old}')
              package_source = package_source.replace(old, new, 1)
          package_path.write_text(package_source, encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes da Nara
        run: npm run test:nara-prompt && npm run test:nara-fixed-layer && npm run test:nara-price-levels && npm run test:nara-unit-queries && npm run test:nara-guardrails && npm run test:nara-dynamic-context && npm run test:nara-phase8 && npm run test:nara-phase9 && npm run test:nara-phase10

      - name: Testes de Meta, Alma e Flow
        run: npm run test:meta-referral && npm run test:alma-table && npm run test:flow-table

      - name: Validar ambiente
        run: npm run check-env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar implementação validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          rm -f scripts/apply-nara-phase10.py .github/workflows/phase10-nara-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Valida os 20 casos finais da Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-10
