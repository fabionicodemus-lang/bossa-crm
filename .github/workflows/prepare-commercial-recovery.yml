name: Prepare commercial recovery snapshot
on:
  pull_request:
    paths: ['.github/workflows/prepare-commercial-recovery.yml']
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.number == 128 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/commercial-metrics-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: commercial_recovery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d commercial_recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: commercial_recovery_test
      BASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hash-verified reviewed patch to disposable checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {inflateSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const shas=['1d862fcf3e3e97be255f85598352a1d88aa96ee5','7d0e25a2c2128c06294a4a7cbd384b2b48bb3707','20f86c1d96fdffdaf377a97fee62cd9ba1e2ce13','22af72b46e9da1ce0ad5154a240a6a150a90c1e2'];
          let encoded='';
          for(const sha of shas){
            const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'}});
            if(!response.ok) throw Error(`Cannot read reviewed patch: ${response.status}`);
            const blob=await response.json();
            let part=Buffer.from(blob.content,'base64').toString('utf8');
            if(sha===shas[0]) part=part.replace('HLUfrAsvAsx','HLUfrAsx');
            encoded+=part;
          }
          const patch=inflateSync(Buffer.from(encoded,'base64'));
          const hash=value=>createHash('sha256').update(value).digest('hex');
          if(hash(patch)!=='7a57c9dba65d30db9d9411aac60ff51e9bc6a740e70b04981a2d050188c9611d') throw Error('Reviewed patch hash mismatch');
          const approved=['.github/workflows/commercial-recovery.yml','docs/commercial-recovery-status.md','scripts/agenda/check-route.mjs','scripts/commercial/check-recovery-concurrency.mjs','scripts/commercial/check-recovery.mjs','scripts/commercial/check-source-request-client.mjs','scripts/recovery/check-route.mjs','scripts/recovery/loader.mjs','scripts/recovery/stubs.mjs','src/app/api/agenda/route.ts','src/app/api/commercial/recovery/route.ts','src/components/AgendaCalendar.tsx','src/components/CommercialSaveRecovery.tsx','src/components/ProposalsManager.tsx','src/lib/commercial/recovery.ts','src/lib/commercial/source-request.ts','supabase/migrations/20261021182758_commercial_recoverable_requests.sql'];
          const patchPath=`${process.env.RUNNER_TEMP}/reviewed-recovery.patch`;
          fs.writeFileSync(patchPath,patch);
          const paths=execFileSync('git',['apply','--numstat',patchPath],{encoding:'utf8'}).trim().split('\n').map(line=>line.split('\t')[2]).sort();
          if(JSON.stringify(paths)!==JSON.stringify(approved.sort())) throw Error('Unexpected patch paths');
          execFileSync('git',['apply','--check',patchPath]);
          execFileSync('git',['apply',patchPath]);
          execFileSync('node',['--check','scripts/commercial/check-recovery-concurrency.mjs']);
          const manifest=Object.fromEntries(paths.map(path=>[path,hash(fs.readFileSync(path))]));
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/recovery-manifest.json`,JSON.stringify(manifest));
          console.log('Reviewed patch and 17 paths verified. No database or branch refs changed.');
          NODE
      - run: npm ci --no-audit --no-fund
      - name: Test recovery SQL with all nine migrations
        run: node scripts/commercial/check-recovery.mjs
      - name: Test recovery endpoint and explicit actions
        run: node --experimental-strip-types --loader ./scripts/recovery/loader.mjs scripts/recovery/check-route.mjs
      - name: Test agenda with durable preparation
        run: node --experimental-strip-types --loader ./scripts/agenda/loader.mjs scripts/agenda/check-route.mjs
      - name: Test prior request semantics and client helpers
        run: |
          node scripts/commercial/check-source-requests.mjs
          node --experimental-strip-types scripts/commercial/check-source-request-client.mjs
      - name: Ensure PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Test real concurrent recovery and abandonment
        run: node scripts/commercial/check-recovery-concurrency.mjs
      - run: npm run lint
      - run: npm run typecheck
      - name: Prepare verified source commit only; do not update refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const repo=process.env.GITHUB_REPOSITORY;
          async function api(path,body){
            const response=await fetch(`https://api.github.com/repos/${repo}/${path}`,{method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
            if(!response.ok) throw Error(`Git object request failed: ${response.status}`);
            return response.json();
          }
          const head=await api('git/ref/heads/feat/commercial-metrics-foundation');
          if(head.object.sha!==process.env.BASE_SHA) throw Error('Branch changed; refusing stale preparation');
          const base=await api(`git/commits/${process.env.BASE_SHA}`);
          const manifest=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/recovery-manifest.json`,'utf8'));
          const tree=Object.entries(manifest).filter(([path])=>!path.startsWith('.github/')).map(([path,hash])=>{
            const content=fs.readFileSync(path,'utf8');
            if(createHash('sha256').update(content).digest('hex')!==hash) throw Error(`Source changed after review: ${path}`);
            if(!/^(src|scripts|supabase\/migrations|docs)\//.test(path)) throw Error('Unapproved source path');
            return {path,mode:'100644',type:'blob',content};
          });
          const createdTree=await api('git/trees',{base_tree:base.tree.sha,tree});
          const commit=await api('git/commits',{message:'Persist recoverable human save commands and serialize resumption against abandonment',tree:createdTree.sha,parents:[process.env.BASE_SHA]});
          console.log(`PREPARED_COMMIT_SHA=${commit.sha}`);
          console.log(`PREPARED_TREE_SHA=${createdTree.sha}`);
          console.log('No branch ref update, production database access or external messages.');
          NODE
