name: Validate Bossa CRM

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund
      - name: Capture lint report
        shell: bash
        run: npm run lint > phase4-lint-initial.txt 2>&1 || true
      - name: Upload phase 4 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: phase4-diagnostic
          path: |
            package-lock.json
            phase4-lint-initial.txt
          if-no-files-found: error
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
          SUPABASE_SECRET_KEY: sb_secret_example
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
