name: Validate Bossa CRM

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'site/**'
  pull_request:
    paths-ignore:
      - 'site/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test commercial ledger and metrics
        run: npm run test:commercial
      - name: Test conservative commercial linking
        run: node scripts/commercial/check-linking.mjs
      - name: Test verified purchase intent
        run: node --experimental-strip-types scripts/commercial/check-intake.mjs
      - name: Test human agenda API session
        run: node --experimental-strip-types --loader ./scripts/agenda/loader.mjs scripts/agenda/check-route.mjs
      - name: Test agenda actor and RLS in PostgreSQL
        run: node scripts/commercial/check-agenda-session.mjs
      - name: Test Hoje workspace
        run: npm run test:hoje-ui
      - name: Test Meta referral attribution
        run: npm run test:meta-referral
      - name: Test Alma sales table
        run: npm run test:alma-table
      - name: Test Flow sales table
        run: npm run test:flow-table
      - name: Test AI files commercial access
        run: npm run test:ai-files-commercial
      - name: Test Nara prompt contract
        run: npm run test:nara-prompt
      - name: Test Nara fixed layer
        run: npm run test:nara-fixed-layer
      - name: Test Nara price levels
        run: npm run test:nara-price-levels
      - name: Test Nara unit queries
        run: npm run test:nara-unit-queries
      - name: Test Nara guardrails
        run: npm run test:nara-guardrails
      - name: Test Nara dynamic context
        run: npm run test:nara-dynamic-context
      - name: Test Nara prompt versions and simulator diagnostics
        run: npm run test:nara-phase8
      - name: Test Nara score and classification vocabulary
        run: npm run test:nara-phase9
      - name: Test Nara final acceptance matrix
        id: nara_final
        continue-on-error: true
        run: npm run test:nara-phase10
      - name: Validate environment
        run: npm run check-env
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Preserve Nara acceptance failure
        if: always() && steps.nara_final.outcome == 'failure'
        run: |
          echo "test:nara-phase10/test:nara-2409 falhou antes das validações finais."
          exit 1
  commercial-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: commercial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d commercial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
      PGDATABASE: commercial_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Test real concurrent intent confirmations
        run: node scripts/commercial/check-intake-concurrency.mjs
