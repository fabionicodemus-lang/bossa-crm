name: Prepare isolated commercial intent migration
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-commercial-intent.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feat/commercial-metrics-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover CLI and create migration in a disposable directory
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npx --yes --package=supabase@2.121.0 supabase --version
          npx --yes --package=supabase@2.121.0 supabase --help
          npx --yes --package=supabase@2.121.0 supabase migration --help
          npx --yes --package=supabase@2.121.0 supabase migration new --help
          npx --yes --package=supabase@2.121.0 supabase migration new commercial_verified_intent
          find supabase/migrations -type f -name '*_commercial_verified_intent.sql' -printf 'GENERATED_MIGRATION=%f\n'
