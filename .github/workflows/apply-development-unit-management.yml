name: Apply development unit management

on:
  push:
    branches:
      - feature/development-unit-management
    paths:
      - scripts/apply-development-unit-management.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-development-unit-management.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DevelopmentsManager.tsx
          git diff --cached --quiet || git commit -m "Permite editar e excluir unidades dos empreendimentos"
          git push
