name: Implementar guardrails da Fase 6 da Nara

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar guardrails e auditoria de ofertas
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import json

          # 1) Bloqueio de consultas para corretor e cliente atual.
          query_path = Path('src/lib/nara-unit-queries.ts')
          query = query_path.read_text(encoding='utf-8')
          query = query.replace(
              "  error?: string;\n};",
              "  error?: string;\n  blocked_reason?: 'corretor' | 'cliente_atual';\n};",
              1,
          )
          query = query.replace(
              "const MONEY_IN_TEXT = /r\\$\\s*\\d[\\d.\\s]*(?:,\\d{1,2})?|\\b\\d+(?:[.,]\\d+)?\\s*(?:milhao|milhoes|mil)\\b/giu;",
              "const MONEY_IN_TEXT = /r\\$\\s*\\d[\\d.\\s]*(?:,\\d{1,2})?\\s*(?:milhao|milhoes|mil)?|\\b\\d+(?:[.,]\\d+)?\\s*(?:milhao|milhoes|mil)\\b/giu;",
              1,
          )
          marker = "export async function loadNaraCommercialTurnContext(\n"
          if marker not in query:
              raise SystemExit('Ponto de inserção do bloqueio comercial não encontrado.')
          helpers = dedent(r'''
          function routingProfileText(value: string): string {
            let normalized = normalizeText(value);
            if (/\bnao sou (?:um |uma )?corretor(?:a)?\b/.test(normalized)) {
              normalized = normalized.replace(/\b(corretor|corretora|imobiliaria|creci)\b/g, ' ');
            }
            if (/\bnao sou (?:um |uma )?cliente\b/.test(normalized)) {
              normalized = normalized.replace(/\b(ja comprei|sou cliente|segunda via|boleto)\b/g, ' ');
            }
            return normalized.replace(/\s+/g, ' ').trim();
          }

          function blockedCommercialProfile(
            lead: Lead,
            history: ChatMessage[],
          ): 'corretor' | 'cliente_atual' | null {
            if (lead.kind === 'corretor') return 'corretor';
            const userMessages = history
              .filter((item) => item.role === 'user')
              .map((item) => routingProfileText(item.content));
            const full = userMessages.join('\n');
            const metadata = routingProfileText(JSON.stringify(lead.metadata ?? {}));
            const brokerSelfIdentification = /\b(?:sou|trabalho como|atuo como|falo como)\s+(?:um |uma )?(?:corretor|corretora)\b/.test(full)
              || /\b(?:minha|da nossa) imobiliaria\b/.test(full)
              || /\b(?:meu )?creci\s*[-:]?\s*\d+/i.test(full)
              || /\bperfil[_ ]?(?:de[_ ])?corretor\b/.test(metadata);
            if (brokerSelfIdentification) return 'corretor';

            const currentCustomerSignal = /\b(ja comprei|sou cliente|comprei com voces|segunda via|boleto|meu contrato|minha unidade|assistencia tecnica|pos-venda)\b/.test(full)
              || /\b(?:cliente_atual|current_customer|pos_venda)\b/.test(metadata);
            return currentCustomerSignal ? 'cliente_atual' : null;
          }

          function blockedCommercialContext(
            reason: 'corretor' | 'cliente_atual',
            consultedAt: string,
          ): NaraCommercialTurnContext {
            if (reason === 'corretor') {
              return {
                consulted_at: consultedAt,
                source_table: 'development_units',
                calls: [],
                blocked_reason: reason,
                error: 'nara_price_disabled_for_broker',
                source_text: 'CONSULTA COMERCIAL BLOQUEADA: o contato se identificou como corretor. Não consulte nem informe preço, tabela, unidade ou disponibilidade. Transfira para o Plantão da Bossa.',
              };
            }
            return {
              consulted_at: consultedAt,
              source_table: 'development_units',
              calls: [],
              blocked_reason: reason,
              error: 'nara_price_disabled_for_current_customer',
              source_text: 'CONSULTA COMERCIAL BLOQUEADA: o contato é cliente atual. Não consulte nem informe preço, tabela, unidade ou disponibilidade. Encaminhe para o pós-venda ou setor responsável.',
            };
          }

          ''')
          query = query.replace(marker, helpers + marker, 1)
          old_loader = dedent(r'''
          export async function loadNaraCommercialTurnContext(
            client: SupabaseClient,
            organizationId: string,
            lead: Lead,
            history: ChatMessage[],
          ): Promise<NaraCommercialTurnContext | null> {
            if (lead.kind !== 'cliente') return null;
            const latest = lastUserMessage(history);
            if (!latest || !hasCommercialSignal(latest)) return null;
            const consultedAt = new Date().toISOString();
            const calls: NaraCommercialCall[] = [];
          ''')
          new_loader = dedent(r'''
          export async function loadNaraCommercialTurnContext(
            client: SupabaseClient,
            organizationId: string,
            lead: Lead,
            history: ChatMessage[],
          ): Promise<NaraCommercialTurnContext | null> {
            const latest = lastUserMessage(history);
            if (!latest || !hasCommercialSignal(latest)) return null;
            const consultedAt = new Date().toISOString();
            const blockedReason = blockedCommercialProfile(lead, history);
            if (blockedReason) return blockedCommercialContext(blockedReason, consultedAt);
            const calls: NaraCommercialCall[] = [];
          ''')
          if old_loader not in query:
              raise SystemExit('Cabeçalho do carregador comercial não encontrado.')
          query = query.replace(old_loader, new_loader, 1)
          query_path.write_text(query, encoding='utf-8')

          # 2) Auditoria obrigatória dos valores citados.
          offer_module = dedent(r'''
          import type { SupabaseClient } from '@supabase/supabase-js';
          import type {
            NaraCommercialTurnContext,
            NaraDevelopmentRange,
            NaraUnitOffer,
          } from './nara-unit-queries';

          type MoneyCitation = {
            field: string;
            amount: number;
            token: string;
          };

          export type NaraOfferAuditRecord = {
            scope: 'range' | 'unit' | 'unstructured';
            source_call: string;
            development_name: string | null;
            unit_code: string | null;
            offered_value: number | null;
            entry_amount: number | null;
            installment_amount: number | null;
            range_min: number | null;
            range_max: number | null;
            range_entry_min: number | null;
            quoted_amounts: MoneyCitation[];
          };

          type PrepareOfferAuditArgs = {
            organizationId: string;
            leadId: string;
            conversationId: string;
            reply: string;
            commercial?: NaraCommercialTurnContext | null;
          };

          const MONEY_PATTERN = /R\$\s*\d[\d.\s]*(?:,\d{1,2})?\s*(?:milh(?:ao|ão|oes|ões)|mil)?|\b\d+(?:[.,]\d+)?\s*(?:milh(?:ao|ão|oes|ões)|mil)\b/giu;

          function normalizeText(value: string): string {
            return value
              .normalize('NFD')
              .replace(/\p{Diacritic}/gu, '')
              .toLocaleLowerCase('pt-BR')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function amountFromToken(token: string): number | null {
            const normalized = normalizeText(token).replace(/r\$\s*/, '').trim();
            const multiplier = /milhao|milhoes/.test(normalized) ? 1_000_000 : /\bmil\b/.test(normalized) ? 1_000 : 1;
            const withoutScale = normalized.replace(/\s*(milhao|milhoes|mil)\b/g, '').trim();
            const numeric = withoutScale.match(/\d[\d.]*?(?:,\d{1,2})?(?=\s|$)/)?.[0]
              ?? withoutScale.match(/\d+(?:[.,]\d+)?/)?.[0]
              ?? '';
            if (!numeric) return null;
            const parsed = numeric.includes(',')
              ? Number(numeric.replace(/\./g, '').replace(',', '.'))
              : multiplier === 1 && /^\d{1,3}(?:\.\d{3})+$/.test(numeric)
                ? Number(numeric.replace(/\./g, ''))
                : Number(numeric);
            return Number.isFinite(parsed) ? Math.round(parsed * multiplier * 100) / 100 : null;
          }

          function moneyCitations(reply: string): MoneyCitation[] {
            const tokens = reply.match(MONEY_PATTERN) ?? [];
            const unique = new Map<number, MoneyCitation>();
            for (const token of tokens) {
              const amount = amountFromToken(token);
              if (amount === null || amount <= 0 || unique.has(amount)) continue;
              unique.set(amount, { field: 'unclassified', amount, token: token.trim() });
            }
            return [...unique.values()];
          }

          function cited(citations: MoneyCitation[], amount: number | null | undefined): MoneyCitation | null {
            if (!amount || !Number.isFinite(amount)) return null;
            const rounded = Math.round(amount * 100) / 100;
            return citations.find((item) => item.amount === rounded) ?? null;
          }

          function offerList(result: NaraUnitOffer[] | NaraUnitOffer | NaraDevelopmentRange | null): NaraUnitOffer[] {
            if (Array.isArray(result)) return result;
            if (result && 'unidade' in result) return [result as NaraUnitOffer];
            return [];
          }

          export function buildNaraOfferAuditRecords(
            reply: string,
            commercial?: NaraCommercialTurnContext | null,
          ): NaraOfferAuditRecord[] {
            const citations = moneyCitations(reply);
            if (!citations.length) return [];
            const matched = new Set<number>();
            const records: NaraOfferAuditRecord[] = [];

            for (const call of commercial?.calls ?? []) {
              if (call.name === 'faixa_empreendimento' && call.result && !Array.isArray(call.result) && 'valor_minimo' in call.result) {
                const range = call.result as NaraDevelopmentRange;
                const min = cited(citations, range.valor_minimo);
                const max = cited(citations, range.valor_maximo);
                const entry = cited(citations, range.entrada_minima);
                const quoted = [
                  min && { ...min, field: 'range_min' },
                  max && { ...max, field: 'range_max' },
                  entry && { ...entry, field: 'range_entry_min' },
                ].filter(Boolean) as MoneyCitation[];
                if (quoted.length) {
                  quoted.forEach((item) => matched.add(item.amount));
                  records.push({
                    scope: 'range',
                    source_call: call.name,
                    development_name: range.empreendimento,
                    unit_code: null,
                    offered_value: null,
                    entry_amount: null,
                    installment_amount: null,
                    range_min: min ? range.valor_minimo : null,
                    range_max: max ? range.valor_maximo : null,
                    range_entry_min: entry ? range.entrada_minima : null,
                    quoted_amounts: quoted,
                  });
                }
              }

              for (const offer of offerList(call.result)) {
                const value = cited(citations, offer.valor);
                const entry = cited(citations, offer.entrada);
                const installment = cited(citations, offer.parcela_media);
                const quoted = [
                  value && { ...value, field: 'offered_value' },
                  entry && { ...entry, field: 'entry_amount' },
                  installment && { ...installment, field: 'installment_amount' },
                ].filter(Boolean) as MoneyCitation[];
                if (!quoted.length) continue;
                quoted.forEach((item) => matched.add(item.amount));
                records.push({
                  scope: 'unit',
                  source_call: call.name,
                  development_name: offer.empreendimento,
                  unit_code: offer.unidade,
                  offered_value: value ? offer.valor : null,
                  entry_amount: entry ? offer.entrada : null,
                  installment_amount: installment ? offer.parcela_media : null,
                  range_min: null,
                  range_max: null,
                  range_entry_min: null,
                  quoted_amounts: quoted,
                });
              }
            }

            const unmatched = citations.filter((item) => !matched.has(item.amount));
            if (unmatched.length) {
              records.push({
                scope: 'unstructured',
                source_call: commercial?.calls.length ? 'user_or_knowledge' : 'without_commercial_query',
                development_name: null,
                unit_code: null,
                offered_value: null,
                entry_amount: null,
                installment_amount: null,
                range_min: null,
                range_max: null,
                range_entry_min: null,
                quoted_amounts: unmatched,
              });
            }
            return records;
          }

          export async function prepareNaraOfferAudit(
            client: SupabaseClient,
            args: PrepareOfferAuditArgs,
          ): Promise<string[]> {
            const records = buildNaraOfferAuditRecords(args.reply, args.commercial);
            if (!records.length) return [];
            const createdAt = new Date().toISOString();
            const payload = records.map((record) => ({
              organization_id: args.organizationId,
              lead_id: args.leadId,
              conversation_id: args.conversationId,
              scope: record.scope,
              source_call: record.source_call,
              development_name: record.development_name,
              unit_code: record.unit_code,
              offered_value: record.offered_value,
              entry_amount: record.entry_amount,
              installment_amount: record.installment_amount,
              range_min: record.range_min,
              range_max: record.range_max,
              range_entry_min: record.range_entry_min,
              quoted_amounts: record.quoted_amounts,
              reply_text: args.reply,
              source_calls: args.commercial?.calls ?? [],
              delivery_status: 'pending',
              created_at: createdAt,
            }));
            const { data, error } = await client.from('nara_offer_logs').insert(payload).select('id');
            if (error) throw new Error(`Não foi possível registrar a oferta antes do envio: ${error.message}`);
            return (data ?? []).map((row) => String(row.id)).filter(Boolean);
          }

          export async function markNaraOfferAuditSent(
            client: SupabaseClient,
            ids: string[],
            whatsappMessageId: string | null,
          ): Promise<void> {
            if (!ids.length) return;
            const { error } = await client.from('nara_offer_logs').update({
              delivery_status: 'sent',
              whatsapp_message_id: whatsappMessageId,
              sent_at: new Date().toISOString(),
              failure_reason: null,
            }).in('id', ids);
            if (error) throw error;
          }

          export async function markNaraOfferAuditFailed(
            client: SupabaseClient,
            ids: string[],
            error: unknown,
          ): Promise<void> {
            if (!ids.length) return;
            const reason = error instanceof Error ? error.message : String(error);
            const { error: updateError } = await client.from('nara_offer_logs').update({
              delivery_status: 'failed',
              failure_reason: reason.slice(0, 1000),
            }).in('id', ids);
            if (updateError) throw updateError;
          }
          ''').strip() + '\n'
          Path('src/lib/nara-offer-log.ts').write_text(offer_module, encoding='utf-8')

          migration = dedent(r'''
          -- BOSSA CRM — auditoria obrigatória de ofertas enviadas pela Nara
          -- Execute depois de 016_nara_prompt_final.sql.

          create table if not exists public.nara_offer_logs (
            id uuid primary key default gen_random_uuid(),
            organization_id uuid not null references public.organizations(id) on delete cascade,
            lead_id uuid not null references public.leads(id) on delete cascade,
            conversation_id uuid references public.whatsapp_conversations(id) on delete set null,
            scope text not null check (scope in ('range', 'unit', 'unstructured')),
            source_call text not null,
            development_name text,
            unit_code text,
            offered_value numeric(14,2),
            entry_amount numeric(14,2),
            installment_amount numeric(14,2),
            range_min numeric(14,2),
            range_max numeric(14,2),
            range_entry_min numeric(14,2),
            quoted_amounts jsonb not null default '[]'::jsonb,
            reply_text text not null,
            source_calls jsonb not null default '[]'::jsonb,
            delivery_status text not null default 'pending'
              check (delivery_status in ('pending', 'sent', 'failed')),
            whatsapp_message_id text,
            failure_reason text,
            sent_at timestamptz,
            created_at timestamptz not null default now()
          );

          create index if not exists nara_offer_logs_lead_created_idx
            on public.nara_offer_logs (lead_id, created_at desc);
          create index if not exists nara_offer_logs_org_created_idx
            on public.nara_offer_logs (organization_id, created_at desc);
          create index if not exists nara_offer_logs_delivery_idx
            on public.nara_offer_logs (organization_id, delivery_status, created_at desc);
          create index if not exists nara_offer_logs_unit_idx
            on public.nara_offer_logs (organization_id, development_name, unit_code, created_at desc)
            where unit_code is not null;

          alter table public.nara_offer_logs enable row level security;

          drop policy if exists nara_offer_logs_select_member on public.nara_offer_logs;
          create policy nara_offer_logs_select_member
            on public.nara_offer_logs for select to authenticated
            using (private.is_org_member(organization_id));

          grant select on public.nara_offer_logs to authenticated;
          ''').strip() + '\n'
          Path('supabase/migrations/017_nara_offer_logs.sql').write_text(migration, encoding='utf-8')

          # 3) Regeneração por escassez fabricada e teto de 45 palavras.
          ai_path = Path('src/lib/ai.ts')
          ai = ai_path.read_text(encoding='utf-8')
          class_marker = "}\n\nconst CLIENT_CLASSIFICATIONS"
          guard_error_class = dedent(r'''

          export class NaraReplyGuardrailError extends Error {
            readonly violations: string[];

            constructor(violations: string[]) {
              super(`A resposta da Nara não passou pelos guardrails: ${violations.join(', ')}.`);
              this.name = 'NaraReplyGuardrailError';
              this.violations = violations;
            }
          }
          ''')
          if class_marker not in ai:
              raise SystemExit('Ponto da classe de erro dos guardrails não encontrado.')
          ai = ai.replace(class_marker, '}' + guard_error_class + '\nconst CLIENT_CLASSIFICATIONS', 1)
          ai = ai.replace(
              "const RECENT_MESSAGES_TO_KEEP = 10;",
              "const RECENT_MESSAGES_TO_KEEP = 10;\nconst NARA_REPLY_WORD_LIMIT = 45;\nconst NARA_REPLY_REGENERATION_ATTEMPTS = 2;",
              1,
          )
          ai = ai.replace(
              "return value.match(/R\\$\\s*\\d[\\d.\\s]*(?:,\\d{1,2})?|\\b\\d+(?:[.,]\\d+)?\\s*(?:milh(?:ao|ão|oes|ões)|mil)\\b/giu) ?? [];",
              "return value.match(/R\\$\\s*\\d[\\d.\\s]*(?:,\\d{1,2})?\\s*(?:milh(?:ao|ão|oes|ões)|mil)?|\\b\\d+(?:[.,]\\d+)?\\s*(?:milh(?:ao|ão|oes|ões)|mil)\\b/giu) ?? [];",
              1,
          )
          blocked_rule = "- Se a consulta comercial estiver vazia ou indisponível, não use valores lembrados: diga que o comercial confirmará a condição vigente."
          blocked_rule_new = blocked_rule + "\\n- Se a consulta comercial estiver bloqueada por perfil de corretor ou cliente atual, não informe nenhum preço: transfira para o Plantão ou pós-venda conforme indicado."
          if blocked_rule not in ai:
              raise SystemExit('Regra de consulta vazia não encontrada.')
          ai = ai.replace(blocked_rule, blocked_rule_new, 1)

          guard_marker = "\nfunction normalizeClientDecision(turn: AiTurn): AiTurn {"
          if guard_marker not in ai:
              raise SystemExit('Ponto de inserção dos guardrails de resposta não encontrado.')
          guard_code = dedent(r'''

          export function naraReplyWordCount(value: string): number {
            return value.match(/[\p{L}\p{N}]+(?:['’.-][\p{L}\p{N}]+)*/gu)?.length ?? 0;
          }

          export function hasForbiddenScarcityClaim(value: string): boolean {
            const normalized = normalizeText(value);
            return /\b(acabou de ser (?:vendid[oa]|reservad[oa]|bloquead[oa])|acabou de (?:vender|reservar|bloquear)|foi (?:vendid[oa]|reservad[oa]) (?:agora|hoje|ha pouco))\b/.test(normalized);
          }

          export function naraReplyGuardrailViolations(value: string): string[] {
            const violations: string[] = [];
            if (!value.trim()) violations.push('resposta_vazia');
            if (naraReplyWordCount(value) > NARA_REPLY_WORD_LIMIT) violations.push('mais_de_45_palavras');
            if (hasForbiddenScarcityClaim(value)) violations.push('escassez_fabricada');
            return violations;
          }

          function cleanedRewrittenReply(value: string): string {
            const trimmed = value.trim();
            const quoted = trimmed.match(/^["“](.*)["”]$/s)?.[1];
            return (quoted ?? trimmed).trim();
          }

          export async function enforceNaraReplyGuardrails(
            turn: AiTurn,
            lead: Lead,
            history: ChatMessage[],
            context: AiTrainingContext,
          ): Promise<AiTurn> {
            turn.reply = ensureFirstTurnIntroduction(turn.reply, history, context);
            let violations = naraReplyGuardrailViolations(turn.reply);
            if (hasUngroundedMoney(turn.reply, history, context)) violations.push('valor_sem_fonte');
            if (!violations.length) return turn;

            for (let attempt = 0; attempt < NARA_REPLY_REGENERATION_ATTEMPTS; attempt += 1) {
              const currentDraft = turn.reply;
              const result = await runWithRetryAndFallback((model, fallbackUsed) => ({
                model,
                input: [
                  inputMessage('system', `Reescreva uma resposta de WhatsApp da Nara, da Bossa. Entregue somente o texto final, sem aspas e sem explicações. O texto completo deve ter no máximo ${NARA_REPLY_WORD_LIMIT} palavras; não corte no meio. Preserve apenas fatos e valores já presentes no rascunho. Não acrescente preço, unidade ou condição. Nunca diga que algo acabou de ser vendido, reservado ou bloqueado; diga apenas que não está disponível e ofereça verificar alternativas. Se houver valor sem fonte, remova-o. Mantenha no máximo uma pergunta.`),
                  inputMessage('system', `Última mensagem do contato: ${lastUserText(history) || 'não informada'}\nConsulta comercial válida deste turno: ${context.commercial?.source_text || 'nenhuma'}`),
                  inputMessage('user', `Motivos da revisão: ${violations.join(', ')}\nRascunho: ${currentDraft}`),
                ],
                requestKind: 'response',
                compacted: Boolean(turn.compacted),
                fallbackUsed,
                maxOutputTokens: 240,
                reasoningEffort: 'low',
                verbosity: 'low',
              }));
              turn.usage_records = [...(turn.usage_records ?? []), result.usage];
              turn.reply = ensureFirstTurnIntroduction(cleanedRewrittenReply(result.outputText), history, context);
              violations = naraReplyGuardrailViolations(turn.reply);
              if (hasUngroundedMoney(turn.reply, history, context)) violations.push('valor_sem_fonte');
              if (!violations.length) return turn;
            }

            throw new NaraReplyGuardrailError(violations);
          }
          ''')
          ai = ai.replace(guard_marker, guard_code + guard_marker, 1)

          old_final = dedent(r'''
              finalTurn.usage_records = usageRecords;
              finalTurn.model_used = result.usage.model;
              finalTurn.compacted = compacted;
              return finalTurn;
            } catch (error) {
              if (error instanceof OpenAiExhaustedError) throw error;
              throw new Error('A resposta estruturada da OpenAI não pôde ser interpretada.');
            }
          }
          ''')
          new_final = dedent(r'''
              finalTurn.usage_records = usageRecords;
              finalTurn.model_used = result.usage.model;
              finalTurn.compacted = compacted;
              return lead.kind === 'cliente'
                ? await enforceNaraReplyGuardrails(finalTurn, lead, effectiveHistory, context)
                : finalTurn;
            } catch (error) {
              if (error instanceof OpenAiExhaustedError || error instanceof NaraReplyGuardrailError) throw error;
              throw new Error('A resposta estruturada da OpenAI não pôde ser interpretada.');
            }
          }
          ''')
          if old_final not in ai:
              raise SystemExit('Bloco final de generateAiTurn não encontrado.')
          ai = ai.replace(old_final, new_final, 1)
          ai_path.write_text(ai, encoding='utf-8')

          wrapper_path = Path('src/lib/ai-v120.ts')
          wrapper = wrapper_path.read_text(encoding='utf-8')
          wrapper = wrapper.replace(
              "import { generateAiTurn as generateCoreAiTurn } from './ai';",
              "import { enforceNaraReplyGuardrails, generateAiTurn as generateCoreAiTurn } from './ai';",
              1,
          )
          old_wrapper_return = "  const turn = await generateCoreAiTurn(effectiveLead, history, context);\n  if (!turn || lead.kind !== 'cliente') return turn;\n  return postProcessNaraTurn(turn, history);"
          new_wrapper_return = "  const turn = await generateCoreAiTurn(effectiveLead, history, context);\n  if (!turn || lead.kind !== 'cliente') return turn;\n  const processed = postProcessNaraTurn(turn, history);\n  return enforceNaraReplyGuardrails(processed, effectiveLead, history, context);"
          if old_wrapper_return not in wrapper:
              raise SystemExit('Retorno do wrapper ai-v120 não encontrado.')
          wrapper = wrapper.replace(old_wrapper_return, new_wrapper_return, 1)
          wrapper_path.write_text(wrapper, encoding='utf-8')

          # 4) Log antes do envio e conclusão depois do envio.
          webhook_path = Path('src/lib/whatsapp/webhookProcessor.ts')
          webhook = webhook_path.read_text(encoding='utf-8')
          webhook = webhook.replace(
              "import { loadNaraCommercialTurnContext } from '@/lib/nara-unit-queries';",
              "import { loadNaraCommercialTurnContext } from '@/lib/nara-unit-queries';\nimport { markNaraOfferAuditFailed, markNaraOfferAuditSent, prepareNaraOfferAudit } from '@/lib/nara-offer-log';",
              1,
          )
          old_send = dedent(r'''
            const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);
            const result = await provider.sendText({
              phoneNumberId,
              accessToken,
              to: destination,
              body: reply,
            });
            await recordOutbound({
          ''')
          new_send = dedent(r'''
            let offerAuditIds: string[] = [];
            try {
              offerAuditIds = await prepareNaraOfferAudit(args.admin, {
                organizationId: args.channel.organization_id,
                leadId: lead.id,
                conversationId: args.conversation.id,
                reply,
                commercial: context.commercial,
              });
            } catch (error) {
              console.error('[nara offer audit prepare]', error);
              await handleAiFailure({
                admin: args.admin,
                channel: args.channel,
                conversation: args.conversation,
                lead,
                error,
              });
              return;
            }

            const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);
            let result;
            try {
              result = await provider.sendText({
                phoneNumberId,
                accessToken,
                to: destination,
                body: reply,
              });
            } catch (error) {
              try {
                await markNaraOfferAuditFailed(args.admin, offerAuditIds, error);
              } catch (auditError) {
                console.error('[nara offer audit failed status]', auditError);
              }
              await handleAiFailure({
                admin: args.admin,
                channel: args.channel,
                conversation: args.conversation,
                lead,
                error,
              });
              return;
            }

            try {
              await markNaraOfferAuditSent(args.admin, offerAuditIds, result.messageId);
            } catch (error) {
              console.error('[nara offer audit sent status]', error);
            }

            await recordOutbound({
          ''')
          if old_send not in webhook:
              raise SystemExit('Bloco de envio do WhatsApp não encontrado.')
          webhook = webhook.replace(old_send, new_send, 1)
          webhook = webhook.replace(
              "      ai_usage: turn.usage_records ?? [],\n    },",
              "      ai_usage: turn.usage_records ?? [],\n      nara_offer_audit_ids: offerAuditIds,\n    },",
              1,
          )
          webhook_path.write_text(webhook, encoding='utf-8')

          # 5) Testes de contrato e integração.
          test = dedent(r'''
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
