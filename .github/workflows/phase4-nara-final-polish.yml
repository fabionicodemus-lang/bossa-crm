name: Ajuste final da Fase 4 da Nara

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconhecer plural e faixa nas perguntas de preço
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          ai_path = Path('src/lib/ai.ts')
          source = ai_path.read_text(encoding='utf-8')
          old = "return /\\b(preco|valor|quanto custa|a partir de|menor apartamento|menor unidade|tabela|condicao de pagamento|entrada|parcela)\\b/.test(normalizeText(text));"
          new = "return /\\b(precos?|valores?|quanto custa|a partir de|faixa(?: de (?:preco|valor))?|menor apartamento|menor unidade|tabela|condicao de pagamento|entrada|parcela)\\b/.test(normalizeText(text));"
          if old not in source:
              raise SystemExit('Detector de pergunta comercial não encontrado.')
          ai_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('scripts/check-nara-price-levels.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = "assert.match(source, /const canKeepGeneralPriceRange = asksCommercialValue\\(lastUser\\)/);"
          addition = "assert.match(source, /precos\\?\\|valores\\?\\|quanto custa\\|a partir de\\|faixa/);"
          if anchor not in test:
              raise SystemExit('Âncora do teste da Fase 4 não encontrada.')
          test_path.write_text(test.replace(anchor, anchor + '\n' + addition, 1), encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes da Nara
        run: |
          npm run test:nara-prompt
          npm run test:nara-fixed-layer
          npm run test:nara-price-levels

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar ajuste validado
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          rm .github/workflows/phase4-nara-final-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai.ts scripts/check-nara-price-levels.mjs .github/workflows/phase4-nara-final-polish.yml
          git commit -m "Reconhece plurais e faixa nas perguntas de preço"
          git push origin HEAD:feature/nara-prompt-v3-phase-4
