name: Prepare isolated commercial stage migration
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-commercial-stages.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feat/commercial-metrics-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current database change notes
        run: |
          curl --fail --silent --show-error --max-time 20 https://supabase.com/changelog.md | head -c 16000
      - name: Generate migration in disposable directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npx --yes --package=supabase@2.121.0 supabase --version
          npx --yes --package=supabase@2.121.0 supabase migration --help
          npx --yes --package=supabase@2.121.0 supabase migration new --help
          npx --yes --package=supabase@2.121.0 supabase migration new commercial_fact_stage_sync
          find supabase/migrations -type f -name '*_commercial_fact_stage_sync.sql' -printf 'GENERATED_MIGRATION=%f\n'
