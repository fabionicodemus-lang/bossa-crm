name: Implementar Fase 8 da Nara

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-8
    paths:
      - .github/workflows/phase8-nara-versioning.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-8
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar implementação
        run: python scripts/apply-nara-phase8.py

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes da Nara
        run: npm run test:nara-prompt && npm run test:nara-fixed-layer && npm run test:nara-price-levels && npm run test:nara-unit-queries && npm run test:nara-guardrails && npm run test:nara-dynamic-context && npm run test:nara-phase8

      - name: Validar ambiente
        run: npm run check-env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar implementação validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json .github/workflows/validate.yml || true
          rm -f tsconfig.tsbuildinfo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/check-nara-phase8.mjs src/lib/nara-prompt-versions.ts src/lib/nara-simulator-diagnostics.ts src/app/api/ai-training/route.ts 'src/app/(crm)/treinamento/[agente]/page.tsx' supabase/migrations/019_nara_prompt_versions.sql supabase/migrations/README.md
          git commit -m "Adiciona versionamento e diagnósticos do simulador da Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-8
