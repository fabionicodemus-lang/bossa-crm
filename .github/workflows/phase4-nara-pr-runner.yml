name: Executar Fase 4 da Nara no PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar patch preparado
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase4-nara-price-levels.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-phase4.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/apply-phase4.py

      - name: Instalar dependências
        run: npm ci

      - name: Validar contrato do prompt
        run: npm run test:nara-prompt

      - name: Validar camada fixa
        run: npm run test:nara-fixed-layer

      - name: Validar níveis de preço
        run: npm run test:nara-price-levels

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar alteração validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          rm .github/workflows/phase4-nara-price-levels.yml
          rm .github/workflows/phase4-nara-pr-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai.ts src/lib/nara-price-levels.ts scripts/check-nara-price-levels.mjs package.json .github/workflows/phase4-nara-price-levels.yml .github/workflows/phase4-nara-pr-runner.yml
          git commit -m "Permite faixa geral de preço antes da intenção confirmada"
          git push origin HEAD:feature/nara-prompt-v3-phase-4
