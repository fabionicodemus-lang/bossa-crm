name: Executar implementação corrigida da Fase 6

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-6
    paths:
      - .github/workflows/phase6-nara-fix-runner.yml

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-6
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar implementação corrigida
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/phase6-nara-guardrails.yml').read_text(encoding='utf-8')
          marker = "          python <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          block = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'

          section_start = script.index("old_send = dedent(r'''")
          section_end_marker = "webhook = webhook.replace(old_send, new_send, 1)\n"
          section_end = script.index(section_end_marker, section_start) + len(section_end_marker)
          replacement = r'''send_start = "  const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);\n  const result = await provider.sendText({"
          record_marker = "  await recordOutbound({"
          send_position = webhook.index(send_start)
          record_position = webhook.index(record_marker, send_position)
          new_send = dedent(r'''
            let offerAuditIds: string[] = [];
            try {
              offerAuditIds = await prepareNaraOfferAudit(args.admin, {
                organizationId: args.channel.organization_id,
                leadId: lead.id,
                conversationId: args.conversation.id,
                reply,
                commercial: context.commercial,
              });
            } catch (error) {
              console.error('[nara offer audit prepare]', error);
              await handleAiFailure({
                admin: args.admin,
                channel: args.channel,
                conversation: args.conversation,
                lead,
                error,
              });
              return;
            }

            const { provider, accessToken, phoneNumberId } = channelAccess(args.channel);
            let result: Awaited<ReturnType<typeof provider.sendText>>;
            try {
              result = await provider.sendText({
                phoneNumberId,
                accessToken,
                to: destination,
                body: reply,
              });
            } catch (error) {
              try {
                await markNaraOfferAuditFailed(args.admin, offerAuditIds, error);
              } catch (auditError) {
                console.error('[nara offer audit failed status]', auditError);
              }
              await handleAiFailure({
                admin: args.admin,
                channel: args.channel,
                conversation: args.conversation,
                lead,
                error,
              });
              return;
            }

            try {
              await markNaraOfferAuditSent(args.admin, offerAuditIds, result.messageId);
            } catch (error) {
              console.error('[nara offer audit sent status]', error);
            }

          ''')
          webhook = webhook[:send_position] + new_send + webhook[record_position:]
          '''
          script = script[:section_start] + replacement + script[section_end:]
          script = script.replace(
              "assert.ok(webhookSource.indexOf('prepareNaraOfferAudit') < webhookSource.indexOf('provider.sendText'));",
              "assert.ok(webhookSource.indexOf('prepareNaraOfferAudit(args.admin') < webhookSource.indexOf('provider.sendText'));",
          )
          script = script.replace(
              "assert.ok(webhookSource.indexOf('markNaraOfferAuditSent') > webhookSource.indexOf('provider.sendText'));",
              "assert.ok(webhookSource.lastIndexOf('markNaraOfferAuditSent') > webhookSource.indexOf('provider.sendText'));",
          )
          Path('/tmp/apply-phase6.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply-phase6.py

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes da Nara
        run: npm run test:nara-prompt && npm run test:nara-fixed-layer && npm run test:nara-price-levels && npm run test:nara-unit-queries && npm run test:nara-guardrails

      - name: Validar ambiente
        run: npm run check-env

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar implementação validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          rm -f .github/workflows/phase6-nara-guardrails.yml
          rm -f .github/workflows/phase6-nara-fix-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate.yml package.json scripts/check-nara-guardrails.mjs src/lib/ai.ts src/lib/ai-v120.ts src/lib/nara-unit-queries.ts src/lib/nara-offer-log.ts src/lib/whatsapp/webhookProcessor.ts supabase/migrations/017_nara_offer_logs.sql .github/workflows/phase6-nara-guardrails.yml .github/workflows/phase6-nara-fix-runner.yml
          git commit -m "Adiciona guardrails e auditoria de ofertas da Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-6
