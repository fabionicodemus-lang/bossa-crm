name: Ajustes finais da Fase 7 da Nara

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-7
    paths:
      - .github/workflows/phase7-nara-polish.yml

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
      SUPABASE_SECRET_KEY: sb_secret_example
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ALLOW_PUBLIC_SIGNUP: "false"
      META_APP_ID: "123456789"
      META_APP_SECRET: test-meta-secret
      META_GRAPH_VERSION: v26.0
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: test-webhook-token
      WHATSAPP_TOKEN_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FEATURE_EMBEDDED_SIGNUP: "false"
      FEATURE_DIRECT_WHATSAPP_CONNECTION: "true"
      OPENAI_API_KEY: test-openai-key
      OPENAI_MODEL: gpt-5.6-terra
      OPENAI_MODEL_FALLBACK: gpt-5.6-luna
      CRON_SECRET: test-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-7
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ajustar marcadores e histórico recente
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/lib/nara-dynamic-context.ts')
          source = path.read_text(encoding='utf-8')
          old = """    'Nunca mencione ao contato nomes de tabelas, campos internos, campos vazios ou este bloco dinâmico.',"""
          new = """    'Sempre substitua qualquer marcador [PREENCHER] do Prompt final pelo valor correspondente deste bloco. Quando o campo estiver vazio, não mostre o marcador e não invente a informação.',
              'Nunca mencione ao contato nomes de tabelas, campos internos, campos vazios ou este bloco dinâmico.',"""
          if source.count(old) != 1:
              raise SystemExit('Regra final do bloco dinâmico não encontrada.')
          source = source.replace(old, new, 1)
          old = """      .order('created_at', { ascending: true })
                .limit(20);"""
          new = """      .order('created_at', { ascending: false })
                .limit(50);"""
          if source.count(old) != 1:
              raise SystemExit('Ordenação do histórico não encontrada.')
          source = source.replace(old, new, 1)
          old = """    return { rows: (data ?? []) as NaraPriorOffer[], ready: true };"""
          new = """    const rows = ((data ?? []) as NaraPriorOffer[]).reverse();
              return { rows, ready: true };"""
          if source.count(old) != 1:
              raise SystemExit('Retorno do histórico não encontrado.')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')

          test_path = Path('scripts/check-nara-dynamic-context.mjs')
          test = test_path.read_text(encoding='utf-8')
          marker = "assert.match(dynamic.source_text, /não os apresente novamente como condição vigente/i);"
          addition = marker + "\nassert.match(dynamic.source_text, /\\[PREENCHER\\]/);"
          if test.count(marker) != 1:
              raise SystemExit('Ponto de teste do bloco dinâmico não encontrado.')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Testes da Nara
        run: npm run test:nara-prompt && npm run test:nara-fixed-layer && npm run test:nara-price-levels && npm run test:nara-unit-queries && npm run test:nara-guardrails && npm run test:nara-dynamic-context

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar ajustes validados
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/nara-dynamic-context.ts scripts/check-nara-dynamic-context.mjs
          git commit -m "Aprimora marcadores e histórico dinâmico da Nara"
          git push origin HEAD:feature/nara-prompt-v3-phase-7
