name: Aplicar Fase 4 da Nara

on:
  push:
    branches:
      - feature/nara-prompt-v3-phase-4

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nara-prompt-v3-phase-4
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar níveis de preço da Nara
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          ai_path = Path('src/lib/ai.ts')
          source = ai_path.read_text(encoding='utf-8')

          old_import = "import { extractNaraPrompt } from './nara-prompt-config';\nimport type { Lead } from './types';"
          new_import = "import { extractNaraPrompt } from './nara-prompt-config';\nimport { asksProtectedCommercialDetail, isGeneralPriceRangeReply } from './nara-price-levels';\nimport type { Lead } from './types';"
          if old_import not in source:
              raise SystemExit('Importação esperada de ai.ts não encontrada.')
          source = source.replace(old_import, new_import, 1)

          old_attempts = """  const triageAttempts = assistantMessages(history)
            .filter((message) => looksLikeTriageQuestion(message, context)).length;

          if (!buyerConfirmed && !routed) {"""
          new_attempts = """  const triageAttempts = assistantMessages(history)
            .filter((message) => looksLikeTriageQuestion(message, context)).length;
          const canKeepGeneralPriceRange = asksCommercialValue(lastUser)
            && !asksProtectedCommercialDetail(lastUser)
            && isGeneralPriceRangeReply(turn.reply)
            && !hasUngroundedMoney(turn.reply, history, context);

          if (!buyerConfirmed && !routed) {
            if (canKeepGeneralPriceRange) {
              turn.reply = ensureFirstTurnIntroduction(turn.reply, history, context);
              turn.classification = 'frio';
              turn.score = Math.min(turn.score, 20);
              turn.stage = 'ia';
              turn.summary = 'Contato recebeu somente uma faixa geral de preço; a intenção de compra ainda não foi confirmada.';
              turn.next_action = 'Continuar a conversa sem liberar unidade específica, tabela, disponibilidade ou condição de pagamento até confirmar a intenção.';
              turn.handoff = false;
              turn.attachment_ids = [];
              turn.extracted.budget = '';
              turn.extracted.typology = '';
              turn.extracted.deadline = '';
              turn.extracted.decision_maker = '';
              return turn;
            }"""
          if old_attempts not in source:
              raise SystemExit('Ponto de aplicação da triagem não encontrado.')
          source = source.replace(old_attempts, new_attempts, 1)
          ai_path.write_text(source, encoding='utf-8')

          price_module = r'''const MONEY_PATTERN = /R\$\s*\d[\d.\s]*(?:,\d{1,2})?|\b\d+(?:[.,]\d+)?\s*(?:milh(?:ao|ão|oes|ões)|mil)\b/giu;

          function normalizePriceText(value: string): string {
            return value
              .normalize('NFD')
              .replace(/\p{Diacritic}/gu, '')
              .toLocaleLowerCase('pt-BR')
              .replace(/\s+/g, ' ')
              .trim();
          }

          function hasSpecificUnitReference(value: string): boolean {
            return /\b(?:unidade|apto|apartamento)\s*(?:n(?:umero)?\s*)?\d{2,4}\b/.test(value)
              || /\b\d{1,2}\s*(?:o|º)?\s*andar\b/.test(value);
          }

          export function asksProtectedCommercialDetail(text: string): boolean {
            const value = normalizePriceText(text);
            if (!value) return false;
            return hasSpecificUnitReference(value)
              || /\b(tabela|disponibilidade|disponivel|reservar|reserva)\b/.test(value)
              || /\b(entrada|parcela|parcelamento|reforco|chaves|sinal|ato|mensais?|plano de pagamento|condicao de pagamento)\b/.test(value)
              || /\b\d+\s*x\b/.test(value);
          }

          export function isGeneralPriceRangeReply(reply: string): boolean {
            const value = normalizePriceText(reply);
            const money = reply.match(MONEY_PATTERN) ?? [];
            if (!value || !money.length) return false;

            const hasStartingPrice = /\b(a partir de|partem de|comecam em|comeca em|valores? desde)\b/.test(value);
            const hasNamedRange = /\bfaixa(?: de)?\b/.test(value);
            const hasBetweenRange = /\bentre\s+(?:r\$|\d)/.test(value) && money.length >= 2;
            const hasFromToRange = /\bde\s+(?:r\$|\d).+\ba\s+(?:r\$|\d)/.test(value) && money.length >= 2;
            if (!hasStartingPrice && !hasNamedRange && !hasBetweenRange && !hasFromToRange) return false;

            return !asksProtectedCommercialDetail(reply);
          }
          '''
          Path('src/lib/nara-price-levels.ts').write_text(price_module, encoding='utf-8')

          test = r'''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import {
            asksProtectedCommercialDetail,
            isGeneralPriceRangeReply,
          } from '../src/lib/nara-price-levels.ts';

          assert.equal(isGeneralPriceRangeReply('No Flow, os valores começam em R$ 995 mil.'), true);
          assert.equal(isGeneralPriceRangeReply('Hoje a faixa geral fica entre R$ 995 mil e R$ 1,3 milhão.'), true);
          assert.equal(isGeneralPriceRangeReply('Há opções de R$ 995 mil a R$ 1,3 milhão.'), true);
          assert.equal(isGeneralPriceRangeReply('A unidade 901 custa R$ 995 mil.'), false);
          assert.equal(isGeneralPriceRangeReply('A entrada é de R$ 100 mil e o saldo em 80 parcelas.'), false);
          assert.equal(isGeneralPriceRangeReply('Temos disponibilidade a partir de R$ 995 mil.'), false);
          assert.equal(isGeneralPriceRangeReply('O valor é R$ 995 mil.'), false);

          assert.equal(asksProtectedCommercialDetail('Quanto custa o Flow?'), false);
          assert.equal(asksProtectedCommercialDetail('Qual é o menor apartamento?'), false);
          assert.equal(asksProtectedCommercialDetail('Qual o valor da unidade 901?'), true);
          assert.equal(asksProtectedCommercialDetail('Qual é a entrada mínima?'), true);
          assert.equal(asksProtectedCommercialDetail('Me manda a tabela.'), true);
          assert.equal(asksProtectedCommercialDetail('Tem disponível no 20º andar?'), true);

          const source = await readFile(new URL('../src/lib/ai.ts', import.meta.url), 'utf8');
          assert.match(source, /const canKeepGeneralPriceRange = asksCommercialValue\(lastUser\)/);
          assert.match(source, /!asksProtectedCommercialDetail\(lastUser\)/);
          assert.match(source, /isGeneralPriceRangeReply\(turn\.reply\)/);
          assert.match(source, /!hasUngroundedMoney\(turn\.reply, history, context\)/);
          assert.match(source, /turn\.score = Math\.min\(turn\.score, 20\)/);
          assert.match(source, /turn\.classification = 'frio'/);
          assert.match(source, /turn\.attachment_ids = \[\]/);

          console.log('Níveis de preço da Nara validados: faixa geral liberada e detalhes protegidos.');
          '''
          Path('scripts/check-nara-price-levels.mjs').write_text(test, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['test:nara-price-levels'] = 'node --experimental-strip-types scripts/check-nara-price-levels.mjs'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Instalar dependências
        run: npm ci

      - name: Validar contrato do prompt
        run: npm run test:nara-prompt

      - name: Validar camada fixa
        run: npm run test:nara-fixed-layer

      - name: Validar níveis de preço
        run: npm run test:nara-price-levels

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Gravar alteração validada
        shell: bash
        run: |
          git checkout -- next-env.d.ts tsconfig.json || true
          rm -f tsconfig.tsbuildinfo
          rm .github/workflows/phase4-nara-price-levels.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai.ts src/lib/nara-price-levels.ts scripts/check-nara-price-levels.mjs package.json .github/workflows/phase4-nara-price-levels.yml
          git commit -m "Permite faixa geral de preço antes da intenção confirmada"
          git push origin HEAD:feature/nara-prompt-v3-phase-4
