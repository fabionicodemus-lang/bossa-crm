name: Fix prompt cache key

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-prompt-cache-key.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Shorten prompt cache key
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/ai.ts')
          content = path.read_text()
          old = "promptCacheKey: explicitCache ? `bossa:${lead.organization_id}:${lead.kind}:atendimento-v1` : undefined,"
          new = "promptCacheKey: explicitCache ? `bossa:${lead.organization_id}:${lead.kind}:v1` : undefined,"
          if old not in content:
              raise SystemExit('Expected prompt cache key line was not found')
          path.write_text(content.replace(old, new, 1))
          PY
          rm .github/workflows/fix-prompt-cache-key.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/ai.ts .github/workflows/fix-prompt-cache-key.yml
          git commit -m "Corrige tamanho da chave de cache da OpenAI"
          git push
